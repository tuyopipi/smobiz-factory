# EMAIL_UNSUBSCRIBE_SECRET and LEADGEN_FORM_SECRET are signing keys nobody
# needs to know: they are generated here (openssl rand) and only set when the
# Worker does not have them yet, so existing signed links keep working.
#
# Copy one allow-listed secret from this repository's Actions secrets to the
# production Worker (webmcp-canary) with `wrangler secret put`.
#
# Manual only (Actions > Worker secret > Run workflow), or when Claude is asked
# to run it. The value never appears in logs or in the repository: it is read
# from the GitHub secret of the same name and piped to wrangler.
name: Worker secret

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Secret to copy to the Worker"
        type: choice
        options: [GOOGLE_MAPS_API_KEY, SOV_OPENAI_API_KEY, EMAIL_UNSUBSCRIBE_SECRET, LEADGEN_FORM_SECRET]

permissions:
  contents: read

jobs:
  put:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: experiments/webmcp-canary
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SECRET_NAME: ${{ inputs.name }}
      VAL_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      VAL_SOV_OPENAI_API_KEY: ${{ secrets.SOV_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: experiments/webmcp-canary/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Put the secret
        run: |
          case "$SECRET_NAME" in
            EMAIL_UNSUBSCRIBE_SECRET|LEADGEN_FORM_SECRET)
              if npx wrangler secret list | grep -q "\"$SECRET_NAME\""; then
                echo "$SECRET_NAME is already set on the Worker; leaving it unchanged."
                exit 0
              fi
              VALUE="$(openssl rand -hex 32)" ;;
            GOOGLE_MAPS_API_KEY) VALUE="$VAL_GOOGLE_MAPS_API_KEY" ;;
            SOV_OPENAI_API_KEY) VALUE="$VAL_SOV_OPENAI_API_KEY" ;;
            *) echo "::error::Not allowed"; exit 1 ;;
          esac
          test -n "$VALUE" || { echo "::error::GitHub secret $SECRET_NAME is empty or missing"; exit 1; }
          printf '%s' "$VALUE" | npx wrangler secret put "$SECRET_NAME"
