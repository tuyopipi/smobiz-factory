<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>F Transfer Booking</title>
  <link rel="stylesheet" href="/forms/common.css">
</head>
<body>
  <main>
    <h1>送迎予約 F</h1>
    <form id="form">
      <label for="pickup">乗車地</label>
      <input id="pickup" name="pickup" placeholder="羽田空港">
      <label for="dropoff">降車地</label>
      <input id="dropoff" name="dropoff" placeholder="渋谷">
      <label for="rideDate">利用日</label>
      <input id="rideDate" name="rideDate" type="date">
      <label for="rideTime">利用時刻</label>
      <input id="rideTime" name="rideTime" placeholder="14:30">
      <label for="passengers">人数</label>
      <input id="passengers" name="passengers" type="number">
      <label for="last">姓</label>
      <input id="last" name="last">
      <label for="first">名</label>
      <input id="first" name="first">
      <label for="mail">メール</label>
      <input id="mail" name="mail">
      <label for="tel">電話番号（半角数字のみ）</label>
      <input id="tel" name="tel" placeholder="09012345678">
      <button type="submit" id="submit">登録を完了する</button>
    </form>
    <div id="result"></div>
  </main>
  <script>
    const expected = {
      pickup: '羽田空港',
      dropoff: '渋谷',
      rideDate: '2026-03-15',
      rideTime: '14:30',
      passengers: '2',
      last: '山田',
      first: '太郎',
      mail: 'taro.yamada.test@example.com',
      tel: '09012345678'
    };
    const messages = {
      tel: '電話番号はハイフンなしの半角数字で入力してください',
      rideDate: '利用日はYYYY-MM-DD形式で入力してください',
      rideTime: '利用時刻はHH:mm形式で入力してください'
    };
    const form = document.querySelector('#form');
    function clearErrors() {
      document.querySelectorAll('.field-error').forEach((el) => el.remove());
    }
    function addError(selector, message) {
      const field = document.querySelector(selector);
      const error = document.createElement('p');
      error.className = 'field-error';
      error.dataset.selector = selector;
      error.textContent = `${selector}: ${message}`;
      field.insertAdjacentElement('afterend', error);
    }
    form.onsubmit = (event) => {
      event.preventDefault();
      clearErrors();
      const errors = [];
      for (const [key, value] of Object.entries(expected)) {
        if (form.elements[key].value !== value) errors.push([`#${key}`, messages[key] || `${value} を入力してください`]);
      }
      for (const [selector, message] of errors) addError(selector, message);
      document.querySelector('#result').textContent = errors.length === 0 ? 'SUCCESS' : 'ERROR';
    };
  </script>
</body>
</html>
