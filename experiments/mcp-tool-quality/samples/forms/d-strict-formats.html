<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>D Strict Formats</title>
  <link rel="stylesheet" href="/forms/common.css">
</head>
<body>
  <main>
    <h1>本人確認 D</h1>
    <form id="form">
      <label for="birthdate">生年月日（YYYY-MM-DD）</label>
      <input id="birthdate" name="birthdate" placeholder="1995-04-01">
      <label for="visitTime">希望時刻（HH:mm）</label>
      <input id="visitTime" name="visitTime" placeholder="14:30">
      <label for="kanaFamily">セイ（全角カナ）</label>
      <input id="kanaFamily" name="kanaFamily">
      <label for="kanaGiven">メイ（全角カナ）</label>
      <input id="kanaGiven" name="kanaGiven">
      <label for="phone">電話番号（半角数字のみ）</label>
      <input id="phone" name="phone">
      <label for="postalCode">郵便番号（半角数字7桁）</label>
      <input id="postalCode" name="postalCode">
      <label for="annualIncome">年収（数字のみ、円やカンマなし）</label>
      <input id="annualIncome" name="annualIncome">
      <button type="submit" id="submit">登録を完了する</button>
    </form>
    <div id="result"></div>
  </main>
  <script>
    document.querySelector('#form').onsubmit = (event) => {
      event.preventDefault();
      const f = event.currentTarget.elements;
      const ok = f.birthdate.value === '1995-04-01' && f.visitTime.value === '14:30' && f.kanaFamily.value === 'ヤマダ' && f.kanaGiven.value === 'タロウ' && f.phone.value === '09012345678' && f.postalCode.value === '1500001' && f.annualIncome.value === '5000000';
      document.querySelector('#result').textContent = ok ? 'SUCCESS' : 'ERROR';
    };
  </script>
</body>
</html>
