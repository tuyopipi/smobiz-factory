<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>C Ambiguous Labels</title>
  <link rel="stylesheet" href="/forms/common.css">
</head>
<body>
  <main>
    <h1>会員登録 C</h1>
    <form id="form">
      <label for="f1">項目1</label><input id="f1" name="f1" placeholder="姓">
      <label for="f2">項目2</label><input id="f2" name="f2" placeholder="名">
      <label for="f3">項目3</label><input id="f3" name="f3" placeholder="メールアドレス">
      <label for="f4">項目4</label><input id="f4" name="f4" placeholder="電話">
      <label for="f5">項目5</label><input id="f5" name="f5" placeholder="郵便番号">
      <label for="f6">項目6</label><input id="f6" name="f6" placeholder="都道府県">
      <label for="f7">項目7</label><input id="f7" name="f7" placeholder="市区町村">
      <label for="f8">項目8</label><input id="f8" name="f8" placeholder="会社">
      <button type="submit" id="submit">登録を完了する</button>
    </form>
    <div id="result"></div>
  </main>
  <script>
    const expected = ['山田', '太郎', 'taro.yamada.test@example.com', '09012345678', '1500001', '東京都', '渋谷区', '株式会社テスト'];
    const messages = ['姓は山田です', '名は太郎です', 'メールアドレスが違います', '電話はハイフンなしの半角数字で入力してください', '郵便番号はハイフンなしの7桁で入力してください', '都道府県は東京都です', '市区町村は渋谷区です', '会社名は株式会社テストです'];
    function clearErrors() {
      document.querySelectorAll('.field-error').forEach((el) => el.remove());
    }
    function addError(selector, message) {
      const field = document.querySelector(selector);
      const error = document.createElement('p');
      error.className = 'field-error';
      error.dataset.selector = selector;
      error.textContent = `${selector}: ${message}`;
      field.insertAdjacentElement('afterend', error);
    }
    document.querySelector('#form').onsubmit = (event) => {
      event.preventDefault();
      clearErrors();
      const errors = [];
      expected.forEach((value, index) => {
        const selector = `#f${index + 1}`;
        if (document.querySelector(selector).value !== value) errors.push([selector, messages[index]]);
      });
      for (const [selector, message] of errors) addError(selector, message);
      const ok = errors.length === 0;
      document.querySelector('#result').textContent = ok ? 'SUCCESS' : 'ERROR';
    };
  </script>
</body>
</html>
