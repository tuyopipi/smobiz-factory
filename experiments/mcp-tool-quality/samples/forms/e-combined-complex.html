<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>E Combined Complex</title>
  <link rel="stylesheet" href="/forms/common.css">
</head>
<body>
  <main>
    <h1>総合申請 E</h1>
    <form id="form">
      <input class="hidden-trap" id="website" name="website" tabindex="-1" autocomplete="off">
      <section class="step active" data-step="1">
        <label for="accountType">アカウント種別</label>
        <select id="accountType" name="accountType">
          <option value="">選択してください</option>
          <option value="business">法人</option>
          <option value="personal">個人</option>
        </select>
        <div id="companyBlock" hidden>
          <label for="x1">法人情報1</label>
          <input id="x1" name="x1" placeholder="会社名">
          <label for="x2">法人情報2</label>
          <input id="x2" name="x2" placeholder="役職">
        </div>
        <button type="button" id="next1">次へ</button>
      </section>
      <section class="step" data-step="2">
        <label for="country">国</label>
        <select id="country" name="country">
          <option value="">選択してください</option>
          <option value="JP">日本</option>
          <option value="US">United States</option>
        </select>
        <div id="addressBlock" hidden>
          <label for="zip">郵便番号（半角数字のみ）</label><input id="zip" name="zip">
          <label for="pref">都道府県</label><input id="pref" name="pref">
          <label for="city">市区町村</label><input id="city" name="city">
        </div>
        <button type="button" id="next2">次へ</button>
      </section>
      <section class="step" data-step="3">
        <label for="n1">入力1</label><input id="n1" name="n1" placeholder="姓">
        <label for="n2">入力2</label><input id="n2" name="n2" placeholder="名">
        <label for="mail">連絡先</label><input id="mail" name="mail" placeholder="メール">
        <label for="tel">電話（数字のみ）</label><input id="tel" name="tel">
        <label for="birth">生年月日（YYYY-MM-DD）</label><input id="birth" name="birth">
        <button type="submit" id="submit">登録を完了する</button>
      </section>
    </form>
    <div id="result"></div>
  </main>
  <script>
    const form = document.querySelector('#form');
    form.accountType.onchange = () => document.querySelector('#companyBlock').hidden = form.accountType.value !== 'business';
    form.country.onchange = () => document.querySelector('#addressBlock').hidden = form.country.value !== 'JP';
    function clearErrors() {
      document.querySelectorAll('.field-error').forEach((el) => el.remove());
    }
    function addError(selector, message) {
      const field = document.querySelector(selector);
      const error = document.createElement('p');
      error.className = 'field-error';
      error.dataset.selector = selector;
      error.textContent = `${selector}: ${message}`;
      field.insertAdjacentElement('afterend', error);
    }
    function show(step) {
      document.querySelectorAll('.step').forEach((el) => el.classList.toggle('active', el.dataset.step === String(step)));
    }
    document.querySelector('#next1').onclick = () => show(2);
    document.querySelector('#next2').onclick = () => show(3);
    form.onsubmit = (event) => {
      event.preventDefault();
      const f = form.elements;
      clearErrors();
      const errors = [];
      if (f.website.value) errors.push(['#website', '隠しフィールド website は入力しないでください']);
      if (f.accountType.value !== 'business') errors.push(['#accountType', 'アカウント種別は法人を選択してください']);
      if (f.x1.value !== '株式会社テスト') errors.push(['#x1', '会社名は株式会社テストです']);
      if (f.x2.value !== 'エンジニア') errors.push(['#x2', '役職はエンジニアです']);
      if (f.country.value !== 'JP') errors.push(['#country', '国は日本を選択してください']);
      if (f.zip.value !== '1500001') errors.push(['#zip', '郵便番号はハイフンなしの7桁で入力してください']);
      if (f.pref.value !== '東京都') errors.push(['#pref', '都道府県は東京都です']);
      if (f.city.value !== '渋谷区') errors.push(['#city', '市区町村は渋谷区です']);
      if (f.n1.value !== '山田') errors.push(['#n1', '姓は山田です']);
      if (f.n2.value !== '太郎') errors.push(['#n2', '名は太郎です']);
      if (f.mail.value !== 'taro.yamada.test@example.com') errors.push(['#mail', 'メールアドレスが違います']);
      if (f.tel.value !== '09012345678') errors.push(['#tel', '電話はハイフンなしの半角数字で入力してください']);
      if (f.birth.value !== '1995-04-01') errors.push(['#birth', '生年月日はYYYY-MM-DD形式で入力してください']);
      for (const [selector, message] of errors) addError(selector, message);
      const ok = errors.length === 0;
      document.querySelector('#result').textContent = ok ? 'SUCCESS' : 'ERROR';
    };
  </script>
</body>
</html>
