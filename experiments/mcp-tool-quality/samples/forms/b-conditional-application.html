<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>B Conditional Application</title>
  <link rel="stylesheet" href="/forms/common.css">
</head>
<body>
  <main>
    <h1>申込フォーム B</h1>
    <form id="form">
      <label for="plan">申込種別</label>
      <select id="plan" name="plan">
        <option value="">選択してください</option>
        <option value="personal">個人</option>
        <option value="business">法人</option>
      </select>
      <div id="businessFields" hidden>
        <label for="company">会社名</label>
        <input id="company" name="company">
        <label for="jobTitle">役職</label>
        <input id="jobTitle" name="jobTitle">
      </div>
      <label for="country">国</label>
      <select id="country" name="country">
        <option value="">選択してください</option>
        <option value="JP">日本</option>
        <option value="US">United States</option>
      </select>
      <div id="jpFields" hidden>
        <label for="prefecture">都道府県</label>
        <select id="prefecture" name="prefecture">
          <option value="">選択してください</option>
          <option value="東京都">東京都</option>
          <option value="大阪府">大阪府</option>
        </select>
        <label for="postalCode">郵便番号（ハイフンなし）</label>
        <input id="postalCode" name="postalCode">
      </div>
      <label for="email">メール</label>
      <input id="email" name="email">
      <label for="phone">電話番号（ハイフンなし）</label>
      <input id="phone" name="phone">
      <button type="submit" id="submit">登録を完了する</button>
    </form>
    <div id="result"></div>
  </main>
  <script>
    const form = document.querySelector('#form');
    const result = document.querySelector('#result');
    form.plan.onchange = () => document.querySelector('#businessFields').hidden = form.plan.value !== 'business';
    form.country.onchange = () => document.querySelector('#jpFields').hidden = form.country.value !== 'JP';
    form.onsubmit = (event) => {
      event.preventDefault();
      const ok = form.plan.value === 'business' && form.company.value === '株式会社テスト' && form.jobTitle.value === 'エンジニア' && form.country.value === 'JP' && form.prefecture.value === '東京都' && form.postalCode.value === '1500001' && form.email.value === 'taro.yamada.test@example.com' && form.phone.value === '09012345678';
      result.textContent = ok ? 'SUCCESS' : 'ERROR';
    };
  </script>
</body>
</html>
