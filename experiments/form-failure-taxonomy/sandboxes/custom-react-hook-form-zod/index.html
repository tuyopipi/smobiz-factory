<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Form Failure Sandbox</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f7f4fb;
      color: #20142f;
    }

    main {
      max-width: 760px;
      margin: 32px auto;
      padding: 24px;
      background: #fff;
      border: 1px solid #e7dff0;
      border-radius: 8px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 650;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      margin-top: 6px;
      padding: 10px 12px;
      border: 1px solid #cabdda;
      border-radius: 6px;
      font: inherit;
    }

    button {
      margin-top: 18px;
      padding: 10px 14px;
      border: 0;
      border-radius: 6px;
      background: #7c3aed;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .error {
      min-height: 20px;
      margin: 4px 0 0;
      color: #b42318;
      font-size: 14px;
    }

    .honeypot-display {
      display: none;
    }

    .honeypot-opacity {
      opacity: 0;
      height: 1px;
      overflow: hidden;
    }

    .honeypot-offscreen {
      position: absolute;
      left: -100000px;
      top: -100000px;
    }

    .summary {
      margin-top: 18px;
      padding: 12px;
      background: #f1ebf8;
      border-radius: 6px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Custom Form Failure Sandbox</h1>
    <form id="sandbox-form" novalidate>
      <section class="step active" data-step="1">
        <label for="family_name">姓</label>
        <input id="family_name" name="family_name" autocomplete="family-name" required>
        <p class="error" data-error-for="family_name"></p>

        <label for="given_name">名</label>
        <input id="given_name" name="given_name" autocomplete="given-name" required>
        <p class="error" data-error-for="given_name"></p>

        <label for="email">メール</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <p class="error" data-error-for="email"></p>

        <label for="phone">電話番号（ハイフンなし）</label>
        <input id="phone" name="phone" type="tel" placeholder="09012345678" maxlength="11" pattern="^[0-9]{10,11}$" required>
        <p class="error" data-error-for="phone"></p>

        <label class="honeypot-display" for="website_url">WebサイトURL</label>
        <input class="honeypot-display" id="website_url" name="website_url" tabindex="-1">

        <button type="button" id="next-1">次へ</button>
      </section>

      <section class="step" data-step="2">
        <label for="postal_code">郵便番号（半角数字のみ）</label>
        <input id="postal_code" name="postal_code" placeholder="1500001" pattern="^[0-9]{7}$" required>
        <p class="error" data-error-for="postal_code"></p>

        <label for="country">国</label>
        <select id="country" name="country" required>
          <option value="">選択してください</option>
          <option value="JP">日本</option>
          <option value="US">United States</option>
        </select>
        <p class="error" data-error-for="country"></p>

        <div id="prefecture-wrap" hidden>
          <label for="prefecture">都道府県</label>
          <select id="prefecture" name="prefecture" required>
            <option value="">選択してください</option>
            <option value="東京都">東京都</option>
            <option value="大阪府">大阪府</option>
            <option value="北海道">北海道</option>
          </select>
          <p class="error" data-error-for="prefecture"></p>
        </div>

        <label for="city">市区町村</label>
        <input id="city" name="city" required>
        <p class="error" data-error-for="city"></p>

        <label for="address_line">番地</label>
        <input id="address_line" name="address_line" required>
        <p class="error" data-error-for="address_line"></p>

        <label class="honeypot-opacity" for="fax_number">FAX</label>
        <input class="honeypot-opacity" id="fax_number" name="fax_number" tabindex="-1">

        <button type="button" id="back-2">戻る</button>
        <button type="button" id="next-2">次へ</button>
      </section>

      <section class="step" data-step="3">
        <label for="company">会社名</label>
        <input id="company" name="company" required>
        <p class="error" data-error-for="company"></p>

        <label for="annual_income">年収（数字のみ）</label>
        <input id="annual_income" name="annual_income" inputmode="numeric" pattern="^[0-9]+$" required>
        <p class="error" data-error-for="annual_income"></p>

        <label class="honeypot-offscreen" for="internal_note">内部メモ</label>
        <input class="honeypot-offscreen" id="internal_note" name="internal_note" tabindex="-1">

        <button type="button" id="back-3">戻る</button>
        <button type="submit" id="submit-button">送信</button>
      </section>
    </form>
    <div id="result" class="summary" aria-live="polite"></div>
  </main>

  <script>
    const form = document.querySelector('#sandbox-form');
    const result = document.querySelector('#result');
    const prefectureWrap = document.querySelector('#prefecture-wrap');

    document.querySelector('#country').addEventListener('change', (event) => {
      prefectureWrap.hidden = event.target.value !== 'JP';
    });

    document.querySelector('#next-1').addEventListener('click', () => {
      if (validateStep(1)) showStep(2);
    });
    document.querySelector('#next-2').addEventListener('click', () => {
      if (validateStep(2)) showStep(3);
    });
    document.querySelector('#back-2').addEventListener('click', () => showStep(1));
    document.querySelector('#back-3').addEventListener('click', () => showStep(2));

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!validateStep(3)) return;
      if (document.querySelector('#website_url').value || document.querySelector('#fax_number').value || document.querySelector('#internal_note').value) {
        result.textContent = 'submitted_error: honeypot field was filled';
        return;
      }
      const data = Object.fromEntries(new FormData(form).entries());
      result.textContent = 'submitted_ok\n' + JSON.stringify(data, null, 2);
    });

    function showStep(step) {
      for (const section of document.querySelectorAll('.step')) {
        section.classList.toggle('active', section.dataset.step === String(step));
      }
    }

    function validateStep(step) {
      clearErrors();
      let ok = true;
      const active = document.querySelector(`.step[data-step="${step}"]`);
      for (const input of active.querySelectorAll('input, select')) {
        if (input.offsetParent === null && !input.className.includes('honeypot')) continue;
        if (input.tabIndex === -1) continue;
        if (input.required && !input.value.trim()) {
          setError(input.name, '入力してください');
          ok = false;
        }
        if (input.id === 'phone' && input.value && !/^[0-9]{10,11}$/.test(input.value)) {
          setError(input.name, '電話番号はハイフンなしの半角数字で入力してください');
          ok = false;
        }
        if (input.id === 'postal_code' && input.value && !/^[0-9]{7}$/.test(input.value)) {
          setError(input.name, '郵便番号は半角数字7桁で入力してください');
          ok = false;
        }
        if (input.id === 'annual_income' && input.value && !/^[0-9]+$/.test(input.value)) {
          setError(input.name, '年収は数字のみで入力してください');
          ok = false;
        }
      }
      if (step === 2 && document.querySelector('#country').value === 'JP' && !document.querySelector('#prefecture').value) {
        setError('prefecture', '都道府県を選択してください');
        ok = false;
      }
      return ok;
    }

    function clearErrors() {
      for (const element of document.querySelectorAll('.error')) element.textContent = '';
    }

    function setError(name, message) {
      const target = document.querySelector(`[data-error-for="${name}"]`);
      if (target) target.textContent = message;
    }
  </script>
</body>
</html>
