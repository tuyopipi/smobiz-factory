<style>
:root{
  color-scheme:light;
  --bg:#f6f7fb; --panel:#fff; --panel-2:#fbfbfe; --ink:#14161d; --muted:#5b6472; --faint:#8c94a4;
  --line:#e7e9f1; --line-2:#dcdfea; --accent:#6f4df6; --accent-d:#4b31c6; --wash:#f2eeff;
  --green:#12a150; --green-bg:#e5f6ec; --amber:#b7791f; --amber-bg:#fbf1e0; --red:#d64545; --red-bg:#fbe9e9; --gray-bg:#eef0f5;
  --sh-sm:0 4px 16px rgba(20,27,45,.06); --sh:0 20px 50px rgba(20,27,45,.12);
  --r:14px; --r-sm:9px;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0; height:100%;}
body{font-family:var(--sans); color:var(--ink); background:var(--bg); line-height:1.6; -webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0; letter-spacing:-.02em;}
button{font-family:inherit;cursor:pointer;}
.mono{font-family:var(--mono);}
.demo-ribbon{background:#14161d;color:#e7ecfb;font-size:12px;text-align:center;padding:6px;}
.demo-ribbon b{color:#9d7bff;}
.app{display:grid; grid-template-columns:230px 1fr; min-height:calc(100% - 29px);}
@media(max-width:820px){ .app{grid-template-columns:1fr;} .side{display:none;} }
.side{background:var(--panel); border-right:1px solid var(--line); padding:20px 14px; display:flex; flex-direction:column; gap:4px;}
.brand{display:flex; align-items:center; gap:9px; font-weight:900; font-size:19px; padding:6px 8px 16px;}
.brand .mk{width:28px;height:28px;border-radius:8px;background:conic-gradient(from 200deg,#6f4df6,#ff5d8f,#ffb02e,#6f4df6);display:grid;place-items:center;}
.brand .mk::after{content:"";width:11px;height:11px;border-radius:4px;background:#fff;}
.navitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14.5px;border:none;background:none;width:100%;text-align:left;}
.navitem:hover{background:var(--panel-2);color:var(--ink);}
.navitem.active{background:var(--wash);color:var(--accent-d);}
.navitem svg{width:18px;height:18px;}
.side .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;}
.side .org{font-size:12.5px;color:var(--muted);padding:0 4px;} .side .org b{display:block;color:var(--ink);font-size:13.5px;}
.langsel{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;background:#fff;color:var(--ink);}
.main{padding:24px clamp(16px,3vw,34px); overflow:auto;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap;}
.topbar h1{font-size:24px;font-weight:800;}
.topbar .who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px;}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,#8f6bff,#6f4df6);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:#fff;color:var(--ink);border-radius:var(--r-sm);padding:9px 15px;font-weight:700;font-size:14px;transition:all .14s;}
.btn:hover{border-color:var(--accent);color:var(--accent-d);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-d);color:#fff;}
.btn.sm{padding:6px 11px;font-size:13px;}
.btn svg{width:15px;height:15px;}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
@media(max-width:900px){ .tiles{grid-template-columns:repeat(2,1fr);} }
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh-sm);}
.tile .t{font-size:12.5px;color:var(--faint);font-weight:600;}
.tile .v{font-size:32px;font-weight:900;letter-spacing:-.03em;margin-top:8px;}
.tile .v small{font-size:14px;color:var(--muted);font-weight:600;}
.tile .sub{font-size:12px;color:var(--muted);margin-top:4px;}
.tile .v.g{color:var(--green);} .tile .v.p{color:var(--accent);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.card .hd h2{font-size:16px;font-weight:800;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.input,.select{border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 12px;font:inherit;font-size:14px;background:#fff;min-width:0;}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--wash);}
.lbl-inline{font-size:12.5px;color:var(--muted);font-weight:600;}
.helper{font-size:11.5px;color:var(--faint);margin-top:3px;}
.tblwrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);font-weight:700;padding:12px 20px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:13px 20px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr.clickable{cursor:pointer;} tbody tr.clickable:hover{background:var(--panel-2);}
.site-url{font-weight:700;} .site-url .mono{font-size:12px;color:var(--muted);font-weight:400;display:block;}
.typechip{display:inline-block;font-size:12px;font-weight:700;color:var(--accent-d);background:var(--wash);padding:3px 10px;border-radius:999px;white-space:nowrap;}
.memo-cell{max-width:210px;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.memo-cell.empty{color:var(--faint);font-style:italic;}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
.pill.active{color:var(--green);background:var(--green-bg);}
.pill.detected{color:var(--amber);background:var(--amber-bg);}
.pill.pending{color:var(--muted);background:var(--gray-bg);}
.pill.error{color:var(--red);background:var(--red-bg);}
.pill.invited{color:var(--amber);background:var(--amber-bg);}
.tag2{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.tag2.c_active{color:var(--green);background:var(--green-bg);} .tag2.c_trial{color:var(--amber);background:var(--amber-bg);} .tag2.c_cancelled{color:var(--muted);background:var(--gray-bg);}
.score{font-weight:800;font-family:var(--mono);}
.score.g{color:var(--green);} .score.a{color:var(--amber);} .score.n{color:var(--faint);}
.sig{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;}
.sig.g{color:var(--green);background:var(--green-bg);} .sig.a{color:var(--amber);background:var(--amber-bg);} .sig.n{color:var(--faint);background:var(--gray-bg);}
.okmark{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:12px;font-weight:900;}
.okmark.yes{color:var(--green);background:var(--green-bg);} .okmark.no{color:var(--red);background:var(--red-bg);}
.hits{font-family:var(--mono);font-weight:700;}
.hits.z{color:var(--faint);font-weight:400;}
.siglist{display:flex;flex-direction:column;gap:2px;}
.sigrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);}
.sigrow:last-child{border-bottom:none;}
.sigrow .k{font-size:13px;color:var(--muted);font-weight:600;}
.sigrow .val{font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;}
.sigrow .val .big{font-family:var(--mono);font-size:22px;letter-spacing:-.02em;}
.checklist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.chk{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;}
.chk.on{color:var(--green);background:var(--green-bg);}
.chk.off{color:var(--faint);background:var(--gray-bg);}
.detail-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;}
.detail-grid>*{min-width:0;}
@media(max-width:820px){ .detail-grid{grid-template-columns:1fr;} }
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.field label{font-size:12px;font-weight:700;color:var(--muted);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
textarea.input{resize:vertical;min-height:64px;}
.keybox{display:flex;gap:8px;align-items:stretch;background:#14162a;border-radius:10px;padding:8px 8px 8px 14px;}
.keybox code{color:#e7ecfb;font-family:var(--mono);font-size:12px;flex:1;min-width:0;display:flex;align-items:center;overflow:auto;white-space:nowrap;}
.keybox button{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:0 14px;font-weight:700;font-size:12.5px;}
.methods-mini{display:flex;gap:6px;margin:10px 0;}
.methods-mini button{flex:1;border:1px solid var(--line-2);background:#fff;border-radius:8px;padding:8px;font-size:12.5px;font-weight:700;color:var(--muted);}
.methods-mini button.active{background:var(--wash);color:var(--accent-d);border-color:var(--accent);}
.scorering{display:grid;place-items:center;padding:8px 0;}
.scorering .n{font-size:52px;font-weight:900;letter-spacing:-.04em;background:linear-gradient(120deg,var(--accent),#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent;}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px;}
.bar>span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),#9d7bff);}
.modal-bg{position:fixed;inset:0;background:rgba(20,22,30,.4);display:grid;place-items:center;padding:20px;z-index:50;}
.modal{background:#fff;border-radius:16px;box-shadow:var(--sh);width:min(520px,100%);padding:26px;}
.modal h3{font-size:18px;font-weight:800;margin-bottom:14px;}
.row-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
[hidden]{display:none!important;}
.muted{color:var(--muted);} .empty{padding:40px 20px;text-align:center;color:var(--muted);}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#14161d;color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--sh);z-index:60;}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px;} .crumb button{background:none;border:none;color:var(--accent-d);font-weight:700;font-size:13px;padding:0;}
.section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 12px;}
</style>

const REQ = ["name","tel","address","hours","geo","image","reserve"];
const filledCount = s => REQ.filter(k=>s.store&&s.store[k]).length;
const completePct = s => Math.round(filledCount(s)/REQ.length*100);
const fillClass = s => { const f=filledCount(s); return f===REQ.length?"g":(f?"a":"n"); };
const typeLabel = k => t("type."+k);
const fmtAgo = t2 => { if(!t2) return "—"; const m=Math.round((now-t2)/60000); if(m<60) return t("ago.m",{x:m}); const h=Math.round(m/60); if(h<24) return t("ago.h",{x:h}); return t("ago.d",{x:Math.round(h/24)}); };
const scoreClass = s => s==null?"n":(s>=80?"g":"a");
function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),1800); }

function sortSites(list){
  const arr=[...list], k=state.sort;
  if(k==="type") arr.sort((a,b)=> TYPES.indexOf(a.type)-TYPES.indexOf(b.type) || completePct(b)-completePct(a));
  else if(k==="fill") arr.sort((a,b)=>completePct(b)-completePct(a));
  else if(k==="status"){ const o={active:0,detected:1,pending:2,error:3}; arr.sort((a,b)=>o[a.status]-o[b.status]); }
  else if(k==="seen") arr.sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
  else if(k==="url") arr.sort((a,b)=>a.url.localeCompare(b.url));
  return arr;
}
function sortSelect(){
  const opts=[["type","sort.type"],["fill","sort.fill"],["status","sort.status"],["seen","sort.seen"],["url","sort.url"]];
  return `<span class="lbl-inline">${t("sort.label")}</span><select class="select" id="sortSel">${opts.map(([v,k])=>`<option value="${v}" ${state.sort===v?"selected":""}>${t(k)}</option>`).join("")}</select>`;
}

function render(){
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));

  if(state.view==="summary") m.innerHTML=viewSummary();

  else if(state.view==="members") m.innerHTML=viewMembers();
  else if(state.view.startsWith("site:")) m.innerHTML=viewSiteDetail(state.view.slice(5));
  bindMain();
}

function signalCells(s){
  const schema = s.schema>0 ? `<span class="sig g">${t("sig.types",{n:s.schema})}</span>` : `<span class="sig n">${t("d.off")}</span>`;
  const crawler = s.crawler ? `<span class="okmark yes">✓</span>` : `<span class="okmark no">✕</span>`;
  const fill = `<span class="sig ${fillClass(s)}">${filledCount(s)}/${REQ.length}</span>`;
  return `<td>${schema}</td><td>${crawler}</td><td>${fill}</td>`;
}
function siteRows(list, opts){
  const withMemo=opts&&opts.memo, action=!(opts&&opts.noAction);
  return list.map(s=>`<tr class="clickable" data-site="${s.id}">
    <td class="site-url">${s.url}<span class="mono">${s.key}</span></td>
    <td><span class="typechip">${typeLabel(s.type)}</span></td>
    <td><span class="pill ${s.status}">${t("st."+s.status)}</span></td>
    ${signalCells(s)}
    ${withMemo?`<td class="memo-cell ${s.memo?"":"empty"}">${s.memo||"—"}</td>`:""}
    <td class="muted">${fmtAgo(s.lastSeen)}</td>
    ${action?`<td>${(s.status==="pending"||s.status==="detected"||s.status==="error")?`<button class="btn sm" data-verify="${s.id}">${t("btn.verify")}</button>`:`<button class="btn sm" data-open="${s.id}">${t("btn.settings")}</button>`}</td>`:""}
  </tr>`).join("");
}

        ${state.method==="wp"
          ? `<p class="muted" style="font-size:13px">${t("d.wpDesc")}</p><div class="keybox"><code>${s.key}</code><button data-copy="${s.key}">${t("d.copy")}</button></div>`
          : `<p class="muted" style="font-size:13px">${state.method==="gtm"?t("d.gtmDesc"):t("d.tagDesc")}</p><div class="keybox"><code>${snippet.replace(/</g,"&lt;")}</code><button data-copy-snip="${s.key}">${t("d.copy")}</button></div>`}
      </div>
    </div>
  </div>`;
}

function viewMembers(){
  return `
  <div class="topbar"><h1>${t("mem.title")}</h1><button class="btn primary" id="inviteBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>${t("mem.invite")}</button></div>
  <div class="card">
    <div class="hd"><h2>${t("mem.team")} (${state.members.length})</h2><span class="muted" style="font-size:13px">${t("mem.helper")}</span></div>
    <div class="tblwrap"><table><thead><tr><th>${t("th.email")}</th><th>${t("th.role")}</th><th>${t("th.status")}</th><th></th></tr></thead><tbody>
      ${state.members.map(mem=>`<tr>
        <td style="font-weight:700">${mem.email}${mem.email===state.me.email?' <span class="muted" style="font-weight:400">'+t("you")+'</span>':''}</td>
        <td><select class="select" data-role="${mem.id}" style="padding:6px 10px">${["admin","operator","viewer"].map(r=>`<option value="${r}" ${mem.role===r?"selected":""}>${t("role."+r)}</option>`).join("")}</select></td>
        <td><span class="pill ${mem.status==="active"?"active":"invited"}">${mem.status==="active"?t("mem.joined"):t("mem.invited")}</span></td>
        <td>${mem.email!==state.me.email?`<button class="btn sm" data-rm="${mem.id}">${t("btn.remove")}</button>`:""}</td>
      </tr>`).join("")}
    </tbody></table></div>
  </div>`;
}

function bindMain(){
  const m=document.getElementById("main");
  m.querySelectorAll("[data-nav-btn]").forEach(b=>b.onclick=()=>setNav(b.dataset.navBtn));
  m.querySelectorAll("tbody tr.clickable[data-site]").forEach(tr=>tr.onclick=e=>{ if(e.target.closest("button,select")) return; state.view="site:"+tr.dataset.site; render(); });
  m.querySelectorAll("[data-open]").forEach(b=>b.onclick=e=>{e.stopPropagation(); state.view="site:"+b.dataset.open; render();});
  m.querySelectorAll("[data-verify]").forEach(b=>b.onclick=e=>{e.stopPropagation(); verify(b.dataset.verify);});
  const q=m.querySelector("#q"); if(q) q.oninput=()=>{state.filter.q=q.value; const p=q.selectionStart; render(); const nq=document.querySelector("#q"); if(nq){nq.focus(); try{nq.setSelectionRange(p,p)}catch(e){}}};
  const tf=m.querySelector("#typeFilter"); if(tf) tf.onchange=()=>{state.filter.type=tf.value; render();};
  m.querySelectorAll("#sortSel").forEach(sel=> sel.onchange=()=>{state.sort=sel.value; render();});
  const ab=m.querySelector("#addBtn"); if(ab) ab.onclick=addModal;
  const bb=m.querySelector("#bulkBtn"); if(bb) bb.onclick=bulkModal;
  const ib=m.querySelector("#inviteBtn"); if(ib) ib.onclick=inviteModal;
  m.querySelectorAll("[data-role]").forEach(sel=>sel.onchange=()=>{state.members.find(x=>x.id===sel.dataset.role).role=sel.value; toast(t("toast.role"));});
  m.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{state.members=state.members.filter(x=>x.id!==b.dataset.rm); toast(t("toast.rm")); render();});
  m.querySelectorAll("[data-method]").forEach(b=>b.onclick=()=>{state.method=b.dataset.method; render();});
  m.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy).catch(()=>{}); toast(t("toast.copyKey"));});
  m.querySelectorAll("[data-copy-snip]").forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(`<script src="https://nurevo.jp/tag.js" data-webmcp-site-key="${b.dataset.copySnip}" defer></`+`script>`).catch(()=>{}); toast(t("toast.copySnip"));});
  const sa=m.querySelector("#saveAeo"); if(sa) sa.onclick=()=>{ const id=state.view.slice(5); const s=state.sites.find(x=>x.id===id); if(s){ const dt=m.querySelector("#dType"), dc=m.querySelector("#dContract"), dm=m.querySelector("#dMemo"), dp=m.querySelector("#dPrice"), ds=m.querySelector("#dSchema"), dcr=m.querySelector("#dCrawler"); if(dt)s.type=dt.value; if(dc)s.contract=dc.value; if(dm)s.memo=dm.value; if(dp)s.price=parseInt(dp.value)||0; if(ds)s.schema=(ds.value==="on")?(s.schema>0?s.schema:3):0; if(dcr)s.crawler=(dcr.value==="on"); } toast(t("toast.saved")); render(); };
}

function verify(id){
  const s=state.sites.find(x=>x.id===id); if(!s) return;
  toast(t("toast.verifying"));
  setTimeout(()=>{ s.status="active"; s.lastSeen=Date.now(); if(!s.schema)s.schema=3; s.crawler=true; toast(t("toast.verified")); render(); }, 900);
}
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }
function modal(html){ document.getElementById("modalRoot").innerHTML=`<div class="modal-bg" id="mbg"><div class="modal">${html}</div></div>`; document.getElementById("mbg").onclick=e=>{if(e.target.id==="mbg")closeModal();}; }
const typeOpts = sel => TYPES.map(k=>`<option value="${k}" ${k===sel?"selected":""}>${typeLabel(k)}</option>`).join("");

function addModal(){
  modal(`<h3>${t("m.addTitle")}</h3>
    <div class="field"><label>${t("m.url")}</label><input class="input" id="mUrl" placeholder="example.com"></div>
    <div class="grid2">
      <div class="field"><label>${t("d.type")}</label><select class="select" id="mType">${typeOpts("salon")}</select></div>
      <div class="field"><label>${t("m.contractLbl")}</label><select class="select" id="mContract">${CONTRACTS.map(c=>`<option value="${c}" ${c==="trial"?"selected":""}>${t("contract."+c)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>${t("m.priceLbl")}</label><input class="input mono" id="mPrice" type="number" placeholder="4000"></div>
    <div class="field"><label>${t("m.memoOpt")}</label><textarea class="input" id="mMemo"></textarea></div>
    <p class="muted" style="font-size:12.5px">${t("m.addHelper")}</p>
    <div class="row-actions"><button class="btn" onclick="closeModal()">${t("m.cancel")}</button><button class="btn primary" id="mAdd">${t("m.register")}</button></div>`);
  document.getElementById("mAdd").onclick=()=>{
    const url=document.getElementById("mUrl").value.trim(); if(!url) return;
    state.sites.unshift({id:uid(), url:url.replace(/^https?:\/\//,""), type:document.getElementById("mType").value, key:"nrv_"+uid()+uid().slice(0,3), status:"pending", schema:0, crawler:false, store:{}, lastSeen:null, memo:document.getElementById("mMemo").value.trim(), contract:document.getElementById("mContract").value, price:parseInt(document.getElementById("mPrice").value)||0});
    closeModal(); toast(t("toast.added")); render();
  };
}
function bulkModal(){
  modal(`<h3>${t("m.bulkTitle")}</h3>
    <div class="grid2"><div class="field"><label>${t("m.typeAll")}</label><select class="select" id="bType">${typeOpts("salon")}</select></div>
    <div class="field"><label>${t("m.contractLbl")}</label><select class="select" id="bContract">${CONTRACTS.map(c=>`<option value="${c}" ${c==="trial"?"selected":""}>${t("contract."+c)}</option>`).join("")}</select></div></div>
    <div class="field"><label>${t("m.urls")}</label><textarea class="input" id="bUrls" rows="6" placeholder="shop1.com&#10;shop2.com&#10;shop3.com"></textarea></div>
    <div class="row-actions"><button class="btn" onclick="closeModal()">${t("m.cancel")}</button><button class="btn primary" id="bAdd">${t("m.bulkTitle")}</button></div>`);
  document.getElementById("bAdd").onclick=()=>{
    const urls=document.getElementById("bUrls").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    const type=document.getElementById("bType").value, contract=document.getElementById("bContract").value;
    urls.forEach(u=>state.sites.unshift({id:uid(), url:u.replace(/^https?:\/\//,""), type, key:"nrv_"+uid()+uid().slice(0,3), status:"pending", schema:0, crawler:false, store:{}, lastSeen:null, memo:"", contract, price:0}));
    closeModal(); toast(t("toast.bulkAdded",{n:urls.length})); render();
  };
}
function inviteModal(){
  modal(`<h3>${t("m.inviteTitle")}</h3>
    <div class="field"><label>${t("m.email")}</label><input class="input" id="iEmail" placeholder="member@example.com"></div>
    <div class="field"><label>${t("m.roleLbl")}</label><select class="select" id="iRole">${["admin","operator","viewer"].map(r=>`<option value="${r}">${t("role."+r)}</option>`).join("")}</select></div>
    <p class="muted" style="font-size:12.5px">${t("m.inviteHelper")}</p>
    <div class="row-actions"><button class="btn" onclick="closeModal()">${t("m.cancel")}</button><button class="btn primary" id="iAdd">${t("m.inviteBtn")}</button></div>`);
  document.getElementById("iAdd").onclick=()=>{
    const email=document.getElementById("iEmail").value.trim(); if(!email) return;
    state.members.push({id:uid(), email, role:document.getElementById("iRole").value, status:"invited"});
    closeModal(); toast(t("toast.invited")); render();
  };
}
window.closeModal=closeModal; window.setLang=setLang;
render();
</script>
