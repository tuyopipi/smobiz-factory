<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nurevo Dashboard</title>
  <style>
    :root{color-scheme:light;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--card:#fff;--bg:#f8fafc;--accent:#2563eb;--good:#15803d;--warn:#b45309;--bad:#b91c1c}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{background:#fff;border-bottom:1px solid var(--line);padding:18px max(20px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between}
    .brand{font-weight:800;font-size:20px;text-decoration:none;color:var(--ink)}.actions{display:flex;gap:10px;align-items:center}main{max-width:1120px;margin:0 auto;padding:32px 20px 64px}
    h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}.toolbar h1{margin-bottom:4px}
    button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:#fff;font-weight:700}button.secondary{background:#e2e8f0;color:var(--ink)}button:disabled{opacity:.6;cursor:wait}
    .lang{background:#fff;color:var(--ink);border:1px solid var(--line)}.error{color:var(--bad)}.success{color:var(--good)}
    .panel,.site-card,.crawler-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 3px 12px #0f172a0a}.panel{margin-top:24px}
    .hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.sites{margin-top:24px;display:grid;gap:18px}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.card-head h2{margin:0 0 4px;font-size:19px}.pill{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;background:#e2e8f0}.pill.good{background:#dcfce7;color:var(--good)}.pill.warn{background:#fef3c7;color:var(--warn)}.pill.bad{background:#fee2e2;color:var(--bad)}
    .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:18px}.metric{border:1px solid var(--line);border-radius:10px;padding:12px}.metric small{display:block;color:var(--muted);margin-bottom:3px}.metric strong{font-size:20px}.metric.good strong{color:var(--good)}.metric.warn strong{color:var(--warn)}.metric.bad strong{color:var(--bad)}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select{border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff}.check{display:flex;gap:8px;align-items:center}.form-actions{display:flex;gap:10px;align-items:center;margin-top:14px}.crawler-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}.crawler-card strong{display:block}.crawler-card small{color:var(--muted)}.empty{text-align:center;padding:32px;color:var(--muted)}
    @media(max-width:720px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <header><a class="brand" href="/dashboard">Nurevo</a><div class="actions"><button class="lang secondary" id="lang" type="button">日本語</button><button id="logout" class="secondary hidden" type="button" data-i18n="logout">Log out</button></div></header>
  <main>
    <section class="toolbar"><div><p class="muted" data-i18n="eyebrow">Dashboard</p><h1 data-i18n="title">Sites and AEO health</h1><p class="muted" data-i18n="intro">Manage your connected sites and see their live coverage.</p></div><button id="refresh" type="button" data-i18n="refresh">Refresh</button></section>
    <section id="auth" class="panel hidden"><h2 data-i18n="authTitle">Sign in with email</h2><p class="muted" data-i18n="authCopy">We will issue a one-time sign-in link valid for 15 minutes.</p><form id="authForm"><div class="field"><label for="authEmail" data-i18n="email">Email</label><input id="authEmail" type="email" required autocomplete="email"></div><div class="form-actions"><button type="submit" data-i18n="sendLink">Send sign-in link</button><span id="authStatus" class="muted" aria-live="polite"></span></div></form></section>
    <section id="app" class="hidden">
      <div class="panel"><h2 data-i18n="registerTitle">Register a site</h2><form id="siteForm"><div class="form-actions"><select id="installType" aria-label="Install type"><option value="tag">タグ設置</option><option value="wp">WordPressプラグイン</option><option value="hosted">Nurevoホスト</option></select><input id="siteUrl" type="url" placeholder="https://example.com" aria-label="Site URL"><input id="siteName" placeholder="店舗名（ホストの場合）" aria-label="Store name"><button type="submit" data-i18n="register">Register</button><span id="siteStatus" class="muted" aria-live="polite"></span></div></form></div>
      <section id="sites" class="sites" aria-live="polite"></section>
      <section class="panel"><h2 data-i18n="crawlerTitle">Supported AI crawlers</h2><div id="crawlers" class="crawler-grid"></div></section>
      <section class="panel" id="billing"><h2>請求</h2><div id="billingSummary" class="muted">読み込み中…</div></section>
    </section>
    <p id="pageError" class="error" role="alert"></p>
  </main>
  <footer style="max-width:1120px;margin:0 auto;padding:0 20px 36px;text-align:center;color:#64748b;font-size:13px"><a href="/terms" style="color:inherit">利用規約</a><span style="margin:0 10px">・</span><a href="/privacy" style="color:inherit">プライバシーポリシー</a><span style="margin:0 10px">・</span><a href="/tokushoho" style="color:inherit">特定商取引法に基づく表記</a></footer>

      ja:{eyebrow:'ダッシュボード',title:'サイトとAEOの状態',intro:'接続済みサイトの状態と情報充足率を管理します。',refresh:'更新',logout:'ログアウト',authTitle:'メールでログイン',authCopy:'15分間有効なワンタイムリンクを発行します。',email:'メールアドレス',sendLink:'リンクを送る',registerTitle:'サイトを登録',register:'登録',crawlerTitle:'対応AIクローラー',status:'稼働',schema:'構造化データ',crawler:'クローラー許可',fill:'情報充足率',lastSeen:'最終確認',save:'設定を保存',saved:'保存しました',settings:'AEO設定',name:'名称',address:'住所',tel:'電話',hours:'営業時間',lat:'緯度',lng:'経度',image:'画像URL',reserve:'予約URL',serveSchema:'JSON-LDを配信',allowCrawlers:'AIクローラーを許可',loading:'読み込み中…',empty:'サイトがありません。',pending:'待機中',active:'稼働中',error:'エラー',never:'未確認',invalid:'有効なURLを入力してください。'},
      zh:{eyebrow:'控制面板',title:'网站与AEO状态',intro:'管理已连接的网站并查看实时覆盖情况。',refresh:'刷新',logout:'退出',authTitle:'使用邮箱登录',authCopy:'发送有效期15分钟的一次性链接。',email:'邮箱',sendLink:'发送链接',registerTitle:'注册网站',register:'注册',crawlerTitle:'支持的AI爬虫',status:'运行',schema:'结构化数据',crawler:'爬虫许可',fill:'信息完整度',lastSeen:'最近访问',save:'保存设置',saved:'已保存',settings:'AEO设置',address:'地址',tel:'电话',hours:'营业时间',lat:'纬度',lng:'经度',image:'图片URL',reserve:'预约URL',serveSchema:'提供JSON-LD',allowCrawlers:'允许AI爬虫',loading:'加载中…',empty:'暂无网站。',pending:'待处理',active:'运行中',error:'错误',never:'从未',invalid:'请输入有效网址。'},
      ko:{eyebrow:'대시보드',title:'사이트 및 AEO 상태',intro:'연결된 사이트와 실시간 상태를 관리합니다.',refresh:'새로고침',logout:'로그아웃',authTitle:'이메일로 로그인',authCopy:'15분 동안 유효한 일회용 링크를 보냅니다.',email:'이메일',sendLink:'링크 보내기',registerTitle:'사이트 등록',register:'등록',crawlerTitle:'지원 AI 크롤러',status:'상태',schema:'구조화 데이터',crawler:'크롤러 허용',fill:'정보 충족률',lastSeen:'최근 확인',save:'설정 저장',saved:'저장됨',settings:'AEO 설정',address:'주소',tel:'전화',hours:'영업시간',lat:'위도',lng:'경도',image:'이미지 URL',reserve:'예약 URL',serveSchema:'JSON-LD 제공',allowCrawlers:'AI 크롤러 허용',loading:'로드 중…',empty:'사이트가 없습니다.',pending:'대기',active:'활성',error:'오류',never:'없음',invalid:'유효한 URL을 입력하세요.'},
      es:{eyebrow:'Panel',title:'Sitios y estado AEO',intro:'Administra tus sitios conectados y su cobertura.',refresh:'Actualizar',logout:'Cerrar sesión',authTitle:'Iniciar sesión con email',authCopy:'Enviaremos un enlace de un solo uso válido 15 minutos.',email:'Email',sendLink:'Enviar enlace',registerTitle:'Registrar sitio',register:'Registrar',crawlerTitle:'Rastreadores de IA compatibles',status:'Estado',schema:'Schema',crawler:'Acceso de rastreadores',fill:'Completitud',lastSeen:'Última visita',save:'Guardar',saved:'Guardado',settings:'Configuración AEO',address:'Dirección',tel:'Teléfono',hours:'Horario',lat:'Latitud',lng:'Longitud',image:'URL de imagen',reserve:'URL de reserva',serveSchema:'Servir JSON-LD',allowCrawlers:'Permitir rastreadores IA',loading:'Cargando…',empty:'No hay sitios.',pending:'Pendiente',active:'Activo',error:'Error',never:'Nunca',invalid:'Introduce una URL válida.'},
      fr:{eyebrow:'Tableau de bord',title:'Sites et état AEO',intro:'Gérez vos sites connectés et leur couverture.',refresh:'Actualiser',logout:'Déconnexion',authTitle:'Connexion par email',authCopy:'Un lien valable 15 minutes sera envoyé.',email:'Email',sendLink:'Envoyer le lien',registerTitle:'Enregistrer un site',register:'Enregistrer',crawlerTitle:'Robots IA pris en charge',status:'État',schema:'Données structurées',crawler:'Accès robots',fill:'Complétude',lastSeen:'Dernière visite',save:'Enregistrer',saved:'Enregistré',settings:'Réglages AEO',address:'Adresse',tel:'Téléphone',hours:'Horaires',lat:'Latitude',lng:'Longitude',image:'URL image',reserve:'URL réservation',serveSchema:'Publier JSON-LD',allowCrawlers:'Autoriser les robots IA',loading:'Chargement…',empty:'Aucun site.',pending:'En attente',active:'Actif',error:'Erreur',never:'Jamais',invalid:'Saisissez une URL valide.'},
      de:{eyebrow:'Dashboard',title:'Sites und AEO-Status',intro:'Verwalten Sie verbundene Websites und ihre Abdeckung.',refresh:'Aktualisieren',logout:'Abmelden',authTitle:'Mit E-Mail anmelden',authCopy:'Ein einmaliger Link ist 15 Minuten gültig.',email:'E-Mail',sendLink:'Link senden',registerTitle:'Website registrieren',register:'Registrieren',crawlerTitle:'Unterstützte KI-Crawler',status:'Status',schema:'Schema',crawler:'Crawler-Zugriff',fill:'Informationsstand',lastSeen:'Zuletzt gesehen',save:'Speichern',saved:'Gespeichert',settings:'AEO-Einstellungen',address:'Adresse',tel:'Telefon',hours:'Öffnungszeiten',lat:'Breitengrad',lng:'Längengrad',image:'Bild-URL',reserve:'Reservierungs-URL',serveSchema:'JSON-LD ausgeben',allowCrawlers:'KI-Crawler erlauben',loading:'Laden…',empty:'Keine Websites.',pending:'Ausstehend',active:'Aktiv',error:'Fehler',never:'Nie',invalid:'Geben Sie eine gültige URL ein.'},
      pt:{eyebrow:'Painel',title:'Sites e estado AEO',intro:'Gerencie sites conectados e sua cobertura.',refresh:'Atualizar',logout:'Sair',authTitle:'Entrar por email',authCopy:'Enviaremos um link válido por 15 minutos.',email:'Email',sendLink:'Enviar link',registerTitle:'Registrar site',register:'Registrar',crawlerTitle:'Rastreadores de IA compatíveis',status:'Status',schema:'Schema',crawler:'Acesso de rastreadores',fill:'Completude',lastSeen:'Última visita',save:'Salvar',saved:'Salvo',settings:'Configurações AEO',address:'Endereço',tel:'Telefone',hours:'Horário',lat:'Latitude',lng:'Longitude',image:'URL da imagem',reserve:'URL de reserva',serveSchema:'Publicar JSON-LD',allowCrawlers:'Permitir rastreadores IA',loading:'Carregando…',empty:'Nenhum site.',pending:'Pendente',active:'Ativo',error:'Erro',never:'Nunca',invalid:'Digite uma URL válida.'}
    };
    const state={lang:localStorage.getItem('nurevo-lang')||'en',sites:[],crawlers:[]};
    const $=s=>document.querySelector(s), t=k=>(i18n[state.lang]||i18n.en)[k]||k;
    function applyLang(){document.documentElement.lang=state.lang;localStorage.setItem('nurevo-lang',state.lang);$('#lang').textContent=state.lang==='ja'?'English':'日本語';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));renderSites();renderCrawlers()}
    async function api(path,options={}){const res=await fetch(path,{credentials:'include',...options});let body={};try{body=await res.json()}catch{}if(!res.ok){const e=new Error(body.error||`HTTP ${res.status}`);e.status=res.status;throw e}return body}
    function statusClass(value){return value==='active'?'good':value==='error'?'bad':'warn'}
    function metric(label,value,kind=''){const d=document.createElement('div');d.className=`metric ${kind}`;d.innerHTML=`<small>${label}</small><strong>${value}</strong>`;return d}
    function renderSites(){const box=$('#sites');if(!box)return;box.replaceChildren();if(!state.sites.length){box.innerHTML=`<div class="panel empty">${t('empty')}</div>`;return}state.sites.forEach(site=>{const card=document.createElement('article');card.className='site-card';const fill=site.fill||{filled:0,total:7,pct:0};const hosted=site.install_type==='hosted';const hostedUrl=site.hostedUrl?`https://nurevo.jp${site.hostedUrl}`:'';card.innerHTML=`<div class="card-head"><div><h2>${esc(site.url||site.hostedUrl||'Hosted store')}</h2><p class="muted">${esc(site.key||'')} · ${esc(site.install_type||'tag')}</p></div><span class="pill ${statusClass(site.status)}">${t(site.status)||esc(site.status)}</span></div>${hosted?`<div class="panel"><strong>店舗ページURL</strong><div style="display:flex;gap:8px;align-items:center;margin-top:8px"><input readonly value="${escAttr(hostedUrl)}" style="flex:1"><button type="button" class="copy-hosted secondary" data-url="${escAttr(hostedUrl)}">コピー</button></div><p class="muted">このURLを店舗のGoogleビジネスプロフィールの「ウェブサイト」欄に貼ってください。</p><label class="check"><input class="gbp-linked" type="checkbox" ${site.gbp_linked?'checked':''}> Googleビジネスプロフィールに貼付け済み</label></div>`:''}<div class="metrics"><div class="metric ${statusClass(site.status)}"><small>${t('status')}</small><strong>${t(site.status)||esc(site.status)}</strong></div><div class="metric ${site.schema_types?'good':'warn'}"><small>${t('schema')}</small><strong>${site.schema_types||0}</strong></div><div class="metric ${site.crawler_allowed?'good':'warn'}"><small>${t('crawler')}</small><strong>${site.crawler_allowed?'ON':'OFF'}</strong></div><div class="metric ${fill.pct>=80?'good':fill.pct?'warn':'bad'}"><small>${t('fill')}</small><strong>${fill.filled}/${fill.total} · ${fill.pct}%</strong></div></div><p class="muted">${t('lastSeen')}: ${site.lastSeen?new Date(site.lastSeen).toLocaleString():t('never')}</p><details><summary>${t('settings')}</summary>${settingsForm(site)}</details>`;const form=card.querySelector('form');if(form)form.addEventListener('submit',e=>saveSettings(e,site));const copy=card.querySelector('.copy-hosted');if(copy)copy.addEventListener('click',()=>navigator.clipboard?.writeText(copy.dataset.url));const linked=card.querySelector('.gbp-linked');if(linked)linked.addEventListener('change',async()=>{await api(`/api/sites/${encodeURIComponent(site.id)}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({gbp_linked:linked.checked})});site.gbp_linked=linked.checked});box.append(card)})}
    function settingsForm(s){const c=s._settings||{};return `<form class="panel settings-form"><div class="form-grid"><div class="field full"><label>${t('name')}</label><input name="name" value="${escAttr(c.name||'')}"></div><div class="field"><label>${t('address')}</label><input name="address" value="${escAttr(c.address||'')}"></div><div class="field"><label>${t('tel')}</label><input name="tel" value="${escAttr(c.tel||'')}"></div><div class="field"><label>${t('hours')}</label><input name="hours" value="${escAttr(c.hours||'')}"></div><div class="field"><label>${t('lat')}</label><input name="lat" type="number" step="any" value="${escAttr(c.lat??'')}"></div><div class="field"><label>${t('lng')}</label><input name="lng" type="number" step="any" value="${escAttr(c.lng??'')}"></div><div class="field"><label>${t('image')}</label><input name="image" type="url" value="${escAttr(c.image||'')}"></div><div class="field full"><label>${t('reserve')}</label><input name="reserve_url" type="url" value="${escAttr(c.reserve_url||'')}"></div><label class="check"><input name="serve_schema" type="checkbox" ${c.serve_schema!==0?'checked':''}> ${t('serveSchema')}</label><label class="check"><input name="allow_crawlers" type="checkbox" ${s.crawler_allowed?'checked':''}> ${t('allowCrawlers')}</label></div><div class="form-actions"><button type="submit">${t('save')}</button><span class="muted" data-save-status></span></div></form>`}
    async function saveSettings(event,site){event.preventDefault();const f=new FormData(event.currentTarget);const body={name:f.get('name'),address:f.get('address'),tel:f.get('tel'),hours:f.get('hours'),lat:f.get('lat')===''?null:Number(f.get('lat')),lng:f.get('lng')===''?null:Number(f.get('lng')),image:f.get('image'),reserve_url:f.get('reserve_url'),serve_schema:f.has('serve_schema'),allow_crawlers:f.has('allow_crawlers')};const status=event.currentTarget.querySelector('[data-save-status]');try{await api(`/api/sites/${encodeURIComponent(site.id)}`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});status.textContent=t('saved');await loadSites()}catch(e){status.textContent=e.message;status.className='error'}}
    function renderCrawlers(){const box=$('#crawlers');if(!box)return;box.replaceChildren(...state.crawlers.map(c=>{const d=document.createElement('div');d.className='crawler-card';d.innerHTML=`<strong>${esc(c.ua)}</strong><small>${esc(c.owner||'')} · ${esc(c.engine||'')}</small>`;return d}))}
    async function loadSites(){const payload=await api('/api/sites');state.sites=payload.sites||[];const detail=await Promise.all(state.sites.map(async s=>{try{const c=await api(`/api/tag/config?k=${encodeURIComponent(s.key)}`);return {...s,_settings:{...c.store,serve_schema:c.jsonld?1:0}}}catch{return s}}));state.sites=detail;renderSites()}
    async function loadCrawlers(){const payload=await api('/api/crawlers');state.crawlers=payload.crawlers||[];renderCrawlers()}
    async function loadBilling(){const box=$('#billingSummary');if(!box)return;try{const b=await api('/api/billing/summary');const refs=(b.referral_payments||[]).map(r=>`${esc(r.name)}: ${r.active_sites}店 × ¥1,200 = ¥${r.monthly_amount_yen}`).join('<br>')||'紹介者なし';box.innerHTML=`<p>稼働課金数: <strong>${b.active_billing_sites}店</strong></p><p>MRR見込み: <strong>¥${b.mrr_yen.toLocaleString()}/月</strong></p><p>紹介者支払い見込み:<br>${refs}</p><p>卸請求: <strong>${b.wholesale.eligible?`¥${b.wholesale.monthly_invoice_yen.toLocaleString()}/月`:'対象外'}</strong>（${esc(b.wholesale.reason||'稼働店数条件を満たしています')}）</p>`}catch(error){box.textContent=error.message}}
    async function boot(){try{await loadSites();await loadCrawlers();await loadBilling();$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden')}catch(e){if(e.status===401){$('#auth').classList.remove('hidden');$('#app').classList.add('hidden')}else $('#pageError').textContent=e.message}}
    $('#lang').addEventListener('click',()=>{const keys=Object.keys(i18n),next=(keys.indexOf(state.lang)+1)%keys.length;state.lang=keys[next];applyLang()});$('#refresh').addEventListener('click',()=>boot());$('#authForm').addEventListener('submit',async e=>{e.preventDefault();const status=$('#authStatus');try{const p=await api('/api/auth/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:$('#authEmail').value})});status.textContent=p.loginLink?`DEV: ${p.loginLink}`:p.message}catch(err){status.textContent=err.message;status.className='error'}});$('#siteForm').addEventListener('submit',async e=>{e.preventDefault();const status=$('#siteStatus');const type=$('#installType').value;const url=$('#siteUrl').value.trim();if(type!=='hosted'&&!url){status.textContent='URL is required';return}try{await api('/api/sites',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url,install_type:type,name:$('#siteName').value.trim()})});$('#siteUrl').value='';$('#siteName').value='';status.textContent='OK';await loadSites()}catch(err){status.textContent=err.message;status.className='error'}});$('#logout').addEventListener('click',async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()});function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(v){return esc(v)}
    const siteObserver=new MutationObserver(()=>document.querySelectorAll('.site-card').forEach(card=>{if(card.dataset.scanDecorated)return;const site=state.sites.find(s=>card.querySelector('h2')?.textContent===String(s.url||s.hostedUrl||'Hosted store'));if(!site||site.install_type==='hosted'){if(site)card.dataset.scanDecorated='1';return}card.dataset.scanDecorated='1';const panel=document.createElement('div');panel.className='panel';const tag=site.tag_detected===null?'未実施':site.tag_detected?'検出':'未検出';const schema=site.schema_in_html===null?'未実施':site.schema_in_html?'検出':'未検出';panel.innerHTML=`<strong>タグ設置スキャン</strong><p class="muted">稼働（ハートビート）とは別に、実HTMLを検査します。</p><div>タグ: ${tag} ／ LocalBusiness schema: ${schema}</div>${site.tag_detected&&!site.schema_in_html?'<p class="muted">JSタグはベストエフォート。確実にするならプラグイン推奨</p>':''}<button type="button" class="scan-site">スキャン</button><span class="scan-status muted"></span>`;panel.querySelector('.scan-site').addEventListener('click',async()=>{const out=panel.querySelector('.scan-status');out.textContent='スキャン中…';try{const result=await api(`/api/sites/${encodeURIComponent(site.id)}/scan`,{method:'POST'});site.tag_detected=result.tag_detected;site.schema_in_html=result.schema_in_html;site.scanned_at=result.scanned_at;out.textContent=`タグ: ${result.tag_detected?'検出':'未検出'} / schema: ${result.schema_in_html?'検出':'未検出'}`}catch(error){out.textContent=error.message}});card.insertBefore(panel,card.querySelector('.metrics'))}));siteObserver.observe($('#sites'),{childList:true});applyLang();boot();
  </script>
</body>
