/* The language the dashboard speaks, decided in this order: an explicit ?lang
   in the address, the choice saved in this browser, the member's own language
   from /api/me (the account language the member chose, else the language they
   registered in - the same order the emails use), the browser's languages, and only then Japanese. The
   eight codes are the dashboard's own; zh-TW/zh-HK/zh-Hant are "tw". */
const HTML_LANG={ja:'ja',en:'en',zh:'zh-CN',tw:'zh-TW',ko:'ko',es:'es',fr:'fr',de:'de'};
function normLang(v){const s=String(v||'').trim().toLowerCase().replace(/_/g,'-');if(!s)return null;if(s==='tw'||/^zh-(tw|hk|mo|hant)/.test(s))return 'tw';const b=s.split('-')[0];return LANGS.includes(b)?b:null}
function queryLang(){try{return normLang(new URLSearchParams(location.search).get('lang'))}catch{return null}}
function savedLang(){try{return normLang(localStorage.getItem('nrv-dash-lang'))}catch{return null}}
function memberLang(m){return m?normLang(m.language)||normLang(m.registration_locale):null}
function browserLang(){try{const list=Array.isArray(navigator.languages)&&navigator.languages.length?navigator.languages:[navigator.language];for(const l of list){const n=normLang(l);if(n)return n}}catch{}return null}
function pickLang(m){return queryLang()||savedLang()||memberLang(m)||browserLang()||'ja'}
if(queryLang())try{localStorage.setItem('nrv-dash-lang',queryLang())}catch{}

   capture phase and painted #main itself, without telling this script which

const HASH_VIEWS=['summary','sites','partner','guide'];
/* Views that need no session. The guide is static content, so a visitor who is

const PUBLIC_VIEWS=['guide'];

   they wanted; the Standard button now says so, and the plan panel marks that

   honoured - Pro is beta and its button is a detail link, not a purchase. */

function toast(msg,sticky){const el=$('#toast');if(!el)return;el.textContent=msg||'';el.hidden=!msg;if(toastTimer)clearTimeout(toastTimer);toastTimer=sticky||!msg?null:setTimeout(()=>{el.hidden=true},9000)}
/* Dialog behaviour for a .modal: focus moves in, Tab stays in, Escape closes,
   and focus goes back where it was. Returns the close function. */
function a11yModal(x,onClose){const prev=document.activeElement;let closed=false;const close=()=>{if(closed)return;closed=true;x.remove();try{if(prev&&typeof prev.focus==='function')prev.focus()}catch{}if(onClose)onClose()};x.addEventListener('keydown',ev=>{if(ev.key==='Escape'){ev.preventDefault();close();return}if(ev.key!=='Tab')return;const f=[...x.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}});setTimeout(()=>{try{const f=x.querySelector('input:not([type=hidden]),button,select,textarea,a[href]');if(f&&typeof f.focus==='function')f.focus()}catch{}},0);return close}
/* Back from Stripe. The worker's success and cancel URLs say only how it went
   (?checkout=success|cancelled, or ?billing=success from a payment link), so
   the site being paid for is remembered here before leaving. On success the
   sites list is polled until the plan moves, for up to a minute. */
const CHECKOUT_KEY='nrv-dash-checkout';
const RETURN_STATE=(()=>{try{const p=new URLSearchParams(location.search),c=p.get('checkout');if(c==='success'||c==='cancelled')return c;if(p.get('billing')==='success')return 'success';return null}catch{return null}})();
function rememberCheckout(s){try{localStorage.setItem(CHECKOUT_KEY,JSON.stringify({id:s.id,plan:s.plan||'free',at:Date.now()}))}catch{}}
function planName(p){return p==='pro'?'Pro':p==='standard'?'Standard':String(p||'free').replace(/^./,c=>c.toUpperCase())}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let returnHandled=false;
async function handleCheckoutReturn(){if(!RETURN_STATE||returnHandled)return;returnHandled=true;let saved=null;try{saved=JSON.parse(localStorage.getItem(CHECKOUT_KEY)||'null');localStorage.removeItem(CHECKOUT_KEY)}catch{}
try{const u=new URL(location.href);u.searchParams.delete('checkout');u.searchParams.delete('billing');history.replaceState(null,'',u.pathname+u.search+u.hash)}catch{}
const target=saved&&SITE_ID_RE.test(String(saved.id||''))?sites.find(s=>s.id===saved.id):null;
if(target){view='site:'+target.id;render()}
if(RETURN_STATE==='cancelled'){toast(t('coCancelled'));return}
toast(t('coSuccess'),true);
const before=target?{[target.id]:saved.plan||'free'}:Object.fromEntries(sites.map(s=>[s.id,s.plan||'free']));
for(let i=0;i<=20;i++){if(i)await sleep(3000);let list;try{list=(await api('/api/sites')).sites||[]}catch{continue}const hit=list.find(s=>s.id in before&&(s.plan||'free')!==before[s.id]);if(hit){try{await load()}catch{}view='site:'+hit.id;render();toast(t('coUpdated').replace('{plan}',planName(hit.plan))+' '+t('coPluginNote'),true);return}}
toast(t('coSlow'),true)}
window.nrvErrText=errText;window.nrvToast=toast;window.nrvA11yModal=a11yModal;window.nrvNormalizeSiteUrl=normalizeSiteUrl;
// The view the page opens on comes from the address bar. sites[] is still empty
// here; load() renders once it has them.
view=viewFromHash()||'summary';
// Who is looking, settled before the first paint so an admin control is not
// drawn in a second time. One lookup per page load, not per refresh.
loadMe().then(()=>load());
