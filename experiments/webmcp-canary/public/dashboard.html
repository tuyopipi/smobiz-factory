/* The AEO score, which the detail panel had no row for at all.
   Three states, told apart rather than blurred: a diagnosis that ran and
   produced a number; one that has never run; and a site with no address to
   diagnose. The middle case used to render as nothing, so a new site looked
   like a broken one. */
function aeoBand(v){return v>=80?'g':v>=50?'a':'n'}
function aeoScoreRow(s){const m=s._aeo,rows=(m&&m.scores||[]).filter(r=>r&&r.score!==null&&r.score!==undefined&&r.score!==''&&Number.isFinite(Number(r.score)));
