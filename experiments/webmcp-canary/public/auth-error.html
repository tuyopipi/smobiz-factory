<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.png"><title>Nurevo</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7fb;color:#17122b;font:16px/1.6 Inter,system-ui,sans-serif}.card{width:min(460px,calc(100% - 32px));padding:32px;border-radius:18px;background:#fff;box-shadow:0 12px 40px #17122b1a;text-align:center}a{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:10px;background:#6f4df6;color:#fff;text-decoration:none;font-weight:700}.lang{position:absolute;top:18px;right:18px}</style></head><body><select class="lang" id="lang" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="tw">繁體中文</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select><main class="card"><h1 id="title"></h1><p id="copy"></p><a id="login" href="/dashboard"></a></main><script>
/* Why a sign-in link failed, in the dashboard's eight languages. The backend
   sends ?reason=expired|used|pending|invalid and ?lang=. Any other reason gets
   the generic text; no reason at all keeps the old meaning, an expired link. */
const LANGS=['ja','en','zh','tw','ko','es','fr','de'];
const HTML_LANG={ja:'ja',en:'en',zh:'zh-CN',tw:'zh-TW',ko:'ko',es:'es',fr:'fr',de:'de'};
const T={
ja:{expired:['ログインリンクの期限切れ','リンクの有効期限が切れています。もう一度ログインしてください。'],used:['このリンクは使用済みです','このログインリンクはすでに使われています。もう一度ログインしてください。'],pending:['承認待ちです','アカウントは承認待ちです。承認後にログインできるようになります。'],invalid:['ログインリンクが無効です','このリンクは無効です。もう一度ログインしてください。'],generic:['ログインできませんでした','ログインリンクを確認できませんでした。もう一度ログインしてください。'],button:'再ログイン',langLabel:'言語'},
en:{expired:['Sign-in link expired','This sign-in link has expired. Please request a new one.'],used:['Link already used','This sign-in link has already been used. Please request a new one.'],pending:['Awaiting approval','Your account is awaiting approval. You can sign in once it is approved.'],invalid:['Invalid sign-in link','This sign-in link is not valid. Please request a new one.'],generic:['Could not sign in','This sign-in link could not be checked. Please request a new one.'],button:'Sign in again',langLabel:'Language'},
zh:{expired:['登录链接已过期','登录链接已过期，请重新登录。'],used:['此链接已使用','此登录链接已被使用，请重新登录。'],pending:['等待审核','您的账户正在等待审核，审核通过后即可登录。'],invalid:['登录链接无效','此链接无效，请重新登录。'],generic:['无法登录','无法验证此登录链接，请重新登录。'],button:'重新登录',langLabel:'语言'},
tw:{expired:['登入連結已過期','登入連結已過期，請重新登入。'],used:['此連結已使用','此登入連結已被使用，請重新登入。'],pending:['等待審核','您的帳戶正在等待審核，審核通過後即可登入。'],invalid:['登入連結無效','此連結無效，請重新登入。'],generic:['無法登入','無法驗證此登入連結，請重新登入。'],button:'重新登入',langLabel:'語言'},
ko:{expired:['로그인 링크 만료','로그인 링크가 만료되었습니다. 다시 로그인해 주세요.'],used:['이미 사용된 링크','이 로그인 링크는 이미 사용되었습니다. 다시 로그인해 주세요.'],pending:['승인 대기 중','계정이 승인 대기 중입니다. 승인되면 로그인할 수 있습니다.'],invalid:['유효하지 않은 로그인 링크','이 링크는 유효하지 않습니다. 다시 로그인해 주세요.'],generic:['로그인할 수 없습니다','로그인 링크를 확인할 수 없습니다. 다시 로그인해 주세요.'],button:'다시 로그인',langLabel:'언어'},
es:{expired:['Enlace caducado','El enlace ha caducado. Solicita un nuevo inicio de sesión.'],used:['Enlace ya utilizado','Este enlace de inicio de sesión ya se ha usado. Solicita uno nuevo.'],pending:['Pendiente de aprobación','Tu cuenta está pendiente de aprobación. Podrás iniciar sesión cuando se apruebe.'],invalid:['Enlace no válido','Este enlace de inicio de sesión no es válido. Solicita uno nuevo.'],generic:['No se pudo iniciar sesión','No se pudo verificar este enlace de inicio de sesión. Solicita uno nuevo.'],button:'Iniciar sesión',langLabel:'Idioma'},
fr:{expired:['Lien expiré','Ce lien a expiré. Veuillez vous reconnecter.'],used:['Lien déjà utilisé','Ce lien de connexion a déjà été utilisé. Demandez-en un nouveau.'],pending:['En attente d’approbation','Votre compte est en attente d’approbation. Vous pourrez vous connecter une fois qu’il sera approuvé.'],invalid:['Lien de connexion non valide','Ce lien de connexion n’est pas valide. Demandez-en un nouveau.'],generic:['Connexion impossible','Ce lien de connexion n’a pas pu être vérifié. Demandez-en un nouveau.'],button:'Se reconnecter',langLabel:'Langue'},
de:{expired:['Link abgelaufen','Der Link ist abgelaufen. Bitte melden Sie sich erneut an.'],used:['Link bereits verwendet','Dieser Anmeldelink wurde bereits verwendet. Bitte fordern Sie einen neuen an.'],pending:['Freigabe ausstehend','Ihr Konto wartet auf Freigabe. Nach der Freigabe können Sie sich anmelden.'],invalid:['Ungültiger Anmeldelink','Dieser Anmeldelink ist ungültig. Bitte fordern Sie einen neuen an.'],generic:['Anmeldung nicht möglich','Dieser Anmeldelink konnte nicht geprüft werden. Bitte fordern Sie einen neuen an.'],button:'Erneut anmelden',langLabel:'Sprache'}};
const REASONS=['expired','used','pending','invalid'];
const q=new URLSearchParams(location.search),select=document.querySelector('#lang');
const reason=q.get('reason');
/* Same codes as the dashboard: zh-TW, zh-HK and zh-Hant are "tw". */
function normLang(v){const s=String(v||'').trim().toLowerCase().replace(/_/g,'-');if(!s)return null;if(s==='tw'||/^zh-(tw|hk|mo|hant)/.test(s))return 'tw';const b=s.split('-')[0];return LANGS.includes(b)?b:null}
function savedLang(){try{return normLang(localStorage.getItem('nrv-dash-lang'))}catch{return null}}
function browserLang(){try{const list=Array.isArray(navigator.languages)&&navigator.languages.length?navigator.languages:[navigator.language];for(const l of list){const n=normLang(l);if(n)return n}}catch{}return null}
function pickLang(){return normLang(q.get('lang'))||savedLang()||browserLang()||'ja'}
function apply(l){l=T[l]?l:'ja';const c=T[l];document.documentElement.lang=HTML_LANG[l];select.value=l;select.setAttribute('aria-label',c.langLabel);const x=!reason?c.expired:REASONS.includes(reason)?c[reason]:c.generic;document.querySelector('#title').textContent=x[0];document.querySelector('#copy').textContent=x[1];document.querySelector('#login').textContent=c.button;document.querySelector('#login').href='/dashboard?lang='+encodeURIComponent(l)}
apply(pickLang());select.onchange=()=>{try{localStorage.setItem('nrv-dash-lang',select.value)}catch{}apply(select.value)};
</script></body></html>
