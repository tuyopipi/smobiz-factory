<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Nurevo AIO · Agency sales kit</title><link rel="stylesheet" href="/agency-sales-kit.css"><script src="/agency-sales-kit.js" defer></script></head>
<body><header><a href="/dashboard#partner">Nurevo AIO</a><label>Language <select id="language"><option value="en">English</option><option value="ja">日本語</option></select></label></header>

<section id="preview" hidden><h2 data-copy="preview"></h2><pre id="proposal"></pre><button id="copy" data-copy="copy"></button> <button id="print" data-copy="print"></button><p id="action-status" role="status"></p></section>
