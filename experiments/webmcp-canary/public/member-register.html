<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.png"><title>Nurevo 登録</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7fb;color:#17122b;font:15px/1.6 Inter,system-ui,sans-serif}.card{width:min(520px,calc(100% - 32px));padding:30px;border-radius:18px;background:#fff;box-shadow:0 12px 40px #17122b1a}label{display:grid;gap:6px;margin:14px 0;font-weight:700}input,select,button{font:inherit;padding:10px;border:1px solid #ddd8ef;border-radius:9px}button{background:#6f4df6;color:#fff;border:0;font-weight:700;cursor:pointer}.muted{color:#6b7180;font-size:13px}.error{color:#b4233d}.success{color:#147a44}</style></head><body><main class="card"><h1>Nurevo メンバー登録</h1><p class="muted">登録後、管理者の承認が必要です。</p><form id="form"><label>メールアドレス<input type="email" name="email" required autocomplete="email"></label><label>役割<select name="role" required><option value="store">店舗</option><option value="referrer">個人紹介者</option><option value="agency">代理店</option></select></label><label>招待コード（任意）<input name="invite" autocomplete="one-time-code"></label><button>登録を申請</button><p id="status" aria-live="polite"></p></form></main><script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const s=document.querySelector('#status');s.className='';s.textContent='送信中…';const f=new FormData(e.currentTarget);try{const r=await fetch('/api/members/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:f.get('email'),role:f.get('role'),invite:f.get('invite')})});const b=await r.json();if(!r.ok)throw new Error(b.message||b.error||'登録できませんでした');s.className='success';s.textContent='登録申請を受け付けました。管理者の承認をお待ちください。';e.currentTarget.reset()}catch(err){s.className='error';s.textContent=err.message}}</script></body></html>
