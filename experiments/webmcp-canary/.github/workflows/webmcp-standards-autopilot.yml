name: WebMCP Standards Autopilot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autopilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/webmcp-canary

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            experiments/webmcp-canary/package-lock.json
            experiments/mcp-tool-quality/package-lock.json

      - name: Install webmcp-canary dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Detect, analyze, and apply WebMCP changes
        id: autofix
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: npm run standards:autofix

      - name: Syntax checks
        run: |
          node --check public/tag.js
          node --check server.mjs
          node --check worker/index.mjs

      - name: Local API smoke test
        run: npm run test:smoke

      - name: Headless WebMCP registration test
        run: npm run test:webmcp-headless

      - name: Install mcp-tool-quality dependencies
        working-directory: experiments/mcp-tool-quality
        run: npm install

      - name: Real LLM regression
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          MCP_REGRESSION_MIN_HIGH_SUCCESS_RATE: ${{ vars.MCP_REGRESSION_MIN_HIGH_SUCCESS_RATE || '0.66' }}
        run: npm run test:mcp-regression

      - name: Commit automated update
        run: |
          if ! git diff --quiet; then
            git config user.name "webmcp-autopilot"
            git config user.email "webmcp-autopilot@example.invalid"
            git add public/tag.js server.mjs worker/index.mjs wrangler.jsonc standards-history
            git commit -m "Auto-follow WebMCP standard changes"
            git push
          fi

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy

      - name: Post-deploy health check
        env:
          PUBLIC_ORIGIN: ${{ vars.WEBMCP_PUBLIC_ORIGIN }}
          WEBMCP_HEALTH_SITE_KEY: ${{ secrets.WEBMCP_HEALTH_SITE_KEY }}
        run: |
          test -n "$PUBLIC_ORIGIN"
          curl -fsS "$PUBLIC_ORIGIN/tag.js" >/dev/null
          curl -fsS "$PUBLIC_ORIGIN/api/ab-results" >/dev/null
          curl -fsS "$PUBLIC_ORIGIN/api/agent-authorization?site_key=$WEBMCP_HEALTH_SITE_KEY" | tee /tmp/auth.json
          grep -q '"registered":true' /tmp/auth.json

      - name: Post-deploy traffic guard
        env:
          PUBLIC_ORIGIN: ${{ vars.WEBMCP_PUBLIC_ORIGIN }}
        run: npm run standards:traffic-guard

      - name: Roll back deployed Worker on health failure
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git checkout HEAD~1 -- public/tag.js server.mjs worker/index.mjs wrangler.jsonc || true
          npm run test:smoke
          npm run test:webmcp-headless
          npm run cf:deploy || true

      - name: Upload standards history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-standards-history
          path: experiments/webmcp-canary/standards-history
