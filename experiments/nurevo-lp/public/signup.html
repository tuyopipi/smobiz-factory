<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Nurevo 新規登録</title><style>body{font:16px system-ui;background:#f6f7fb;color:#17213a;margin:0}main{max-width:460px;margin:8vh auto;padding:32px;background:white;border-radius:20px}a{color:#5146c8}label{display:block;margin:20px 0}input,button{box-sizing:border-box;width:100%;padding:13px;font:inherit;border:1px solid #cbd0dd;border-radius:8px;margin-top:8px}button{background:#5146c8;color:white;cursor:pointer}button:disabled{opacity:.6}#message{min-height:2em}small{color:#5f697b}</style></head><body><main><a href="/">Nurevo</a><h1 id="heading">新規登録</h1><form id="signup"><label><span id="email-label">メールアドレス</span><input type="email" name="email" autocomplete="email" maxlength="254" required></label><label><span id="referral-label">紹介コード（任意）</span><input name="referral_code" autocomplete="off" maxlength="64"></label><button id="submit" type="submit">確認メールを送信</button></form><p id="message" role="status" aria-live="polite"></p><small id="note">メールのリンクからログインできます。リンクは15分間有効です。</small><p><a href="/dashboard" id="login">ログイン</a></p></main><script src="/assets/signup.js" defer></script></body></html>
