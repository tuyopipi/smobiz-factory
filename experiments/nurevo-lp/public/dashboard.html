<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurevo Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#f6f7fb;--p:#fff;--ink:#14161d;--muted:#5b6472;--line:#e7e9f1;--a:#6f4df6;--ad:#4b31c6;--wash:#f2eeff;--g:#12a150;--gb:#e5f6ec;--r:#d64545;--rb:#fbe9e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Inter,system-ui,sans-serif}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:5px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:19px;padding:6px 8px 16px;color:var(--ink);text-decoration:none}.mk{width:28px;height:28px;border-radius:8px;background:conic-gradient(#6f4df6,#ff5d8f,#ffb02e,#6f4df6);display:grid;place-items:center}.mk:after{content:"";width:11px;height:11px;border-radius:4px;background:#fff}.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:700;text-align:left}.nav:hover,.nav.active{background:var(--wash);color:var(--ad)}.foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}.org{color:var(--muted);font-size:12px;padding:0 4px 10px}.org b{display:block;color:var(--ink);font-size:13px}.lang,.input,.select{border:1px solid #dcdfea;border-radius:9px;padding:9px 11px;background:#fff}.lang{width:100%}.main{padding:28px clamp(16px,3vw,38px);overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}.top h1{margin:0;font-size:24px}.who{color:var(--muted)}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}.tile,.card{background:var(--p);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px #141b2d0e}.tile{padding:18px}.tile small{display:block;color:var(--muted);font-weight:700}.tile strong{font-size:30px;display:block;margin-top:5px}.green{color:var(--g)}.purple{color:var(--a)}.card .head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card h2{font-size:16px;margin:0}.btn{border:1px solid #dcdfea;background:#fff;border-radius:9px;padding:8px 13px;font-weight:700;cursor:pointer}.btn.primary{background:var(--a);border-color:var(--a);color:#fff}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:#8c94a4;font-size:11px;padding:11px 18px;border-bottom:1px solid var(--line)}td{padding:12px 18px;border-bottom:1px solid var(--line)}tr.click{cursor:pointer}tr.click:hover{background:#fbfbfe}.url{font-weight:700}.url code{display:block;color:var(--muted);font-size:11px;font-weight:400}.pill,.sig{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800}.pill.active,.sig.g{color:var(--g);background:var(--gb)}.pill.error{color:var(--r);background:var(--rb)}.pill.pending,.sig.n{color:var(--muted);background:#eef0f5}.sig.a{color:#b7791f;background:#fbf1e0}.type{color:var(--ad);background:var(--wash);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700}.crawlergrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 20px}.crawler{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfbfe}.crawler strong{display:block}.crawler small{color:var(--muted)}.detail{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.panel{padding:20px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:var(--muted);font-weight:700}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sigrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}.empty{text-align:center;padding:38px;color:var(--muted)}.notice{color:var(--muted);font-size:13px}.modal{position:fixed;inset:0;background:#14161d66;display:grid;place-items:center;padding:18px}.modal>div{background:#fff;border-radius:14px;padding:22px;width:min(500px,100%)}.error{color:var(--r)}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}.crawlergrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.detail{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><a class="brand" href="https://nurevo.jp/"><span class="mk"></span>Nurevo</a><button class="nav active" data-view="summary">▦ <span data-k="summary">サマリー</span></button><button class="nav" data-view="sites">▤ <span data-k="sites">サイト</span></button><button class="nav" data-view="guide">？ <span data-k="guide">ガイド</span></button><button class="nav" data-view="billing">＄ <span data-k="billing">請求</span></button><div class="foot"><div class="org"><b>Nurevo</b><span id="meta"></span></div><select class="lang" id="lang"><option value="ja">🇯🇵 日本語</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 简体中文</option><option value="tw">🇹🇼 繁體中文</option><option value="ko">🇰🇷 한국어</option><option value="es">🇪🇸 Español</option><option value="fr">🇫🇷 Français</option><option value="de">🇩🇪 Deutsch</option></select></div></aside><main class="main" id="main"></main></div><div id="modal"></div><script>
const I={ja:{summary:'サマリー',sites:'サイト',billing:'請求',title:'サイトとAEOの状態',active:'稼働サイト数',schema:'schema出力サイト',fill:'平均 情報充足率',crawler:'対応AIクローラー',manage:'サイト管理へ',refresh:'更新',add:'サイト登録',search:'検索',status:'稼働',last:'最終確認',settings:'設定',save:'保存',saved:'保存しました',empty:'サイトがありません。',name:'名称',address:'住所',tel:'電話',hours:'営業時間',lat:'緯度',lng:'経度',image:'画像URL',reserve:'予約URL',serve:'JSON-LDを配信',allow:'AIクローラーを許可',install:'導入方式',url:'URL',hosted:'Nurevoホスト',tag:'タグ設置',wp:'WordPress',register:'登録',cancel:'キャンセル',auth:'ログインが必要です。',send:'ログインリンクを送信',email:'メールアドレス',mrr:'MRR見込み',billSites:'稼働課金数',wholesale:'卸請求'},en:{summary:'Summary',sites:'Sites',billing:'Billing',title:'Sites and AEO health',active:'Live sites',schema:'Schema output',fill:'Avg. information fill',crawler:'Supported AI crawlers',manage:'Manage sites',refresh:'Refresh',add:'Register site',search:'Search',status:'Status',last:'Last seen',settings:'Settings',save:'Save',saved:'Saved',empty:'No sites yet.',name:'Name',address:'Address',tel:'Phone',hours:'Opening hours',lat:'Latitude',lng:'Longitude',image:'Image URL',reserve:'Reservation URL',serve:'Serve JSON-LD',allow:'Allow AI crawlers',install:'Install type',url:'URL',hosted:'Nurevo hosted',tag:'Tag',wp:'WordPress',register:'Register',cancel:'Cancel',auth:'Sign-in required.',send:'Send login link',email:'Email',mrr:'Estimated MRR',billSites:'Billable sites',wholesale:'Wholesale invoice'}};for(const x of ['zh','tw','ko','es','fr','de'])I[x]=I.en;let lang=localStorage.getItem('nrv-dash-lang')||'ja',view='summary',sites=[],crawlers=[],billing=null,q='',sort='url';const t=k=>(I[lang]||I.ja)[k]||I.ja[k]||k,$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(p,o={}){const r=await fetch(p,{credentials:'include',...o});let b={};try{b=await r.json()}catch{}if(!r.ok){const e=Error(b.error||`HTTP ${r.status}`);e.status=r.status;throw e}return b}
function status(v){return v==='active'?'active':v==='error'?'error':'pending'}function pct(s){return s.fill?.pct||0}function render(){document.querySelectorAll('[data-k]').forEach(e=>e.textContent=t(e.dataset.k));$('#lang').value=lang;document.querySelectorAll('.nav').forEach(e=>e.classList.toggle('active',e.dataset.view===view));$('#main').innerHTML=view==='summary'?summary():view==='sites'?sitesView():view==='billing'?billingView():detail(sites.find(s=>s.id===view.slice(5)));bind()}
function criticalState(s){const intro=s.install_type==='hosted'||(s.checklist||[]).some(x=>x.key==='tag_schema'&&x.done);const gbp=s.install_type!=='hosted'||(s.checklist||[]).some(x=>x.key==='gbp_linked'&&x.done);const paid=s.billing?.status==='active';return {intro,gbp,paid,missing:[intro,gbp,paid].filter(x=>!x).length}}
function rows(list){if(!list.length)return `<div class="empty">${t('empty')}</div>`;const ordered=[...list].sort((a,b)=>criticalState(a).missing-criticalState(b).missing||String(a.url||a.slug).localeCompare(String(b.url||b.slug)));return `<div class="tablewrap"><table><thead><tr><th>Site</th><th>${t('install')}</th><th>${t('status')}</th><th>${t('schema')}</th><th>${t('crawler')}</th><th>${t('fill')}</th><th>${t('last')}</th></tr></thead><tbody>${ordered.map(s=>{const c=criticalState(s);return `<tr class="click ${c.missing?'critical-incomplete':''}" data-site="${esc(s.id)}"><td class="url">${c.missing?'<span class="critical-badge">要対応</span> ':''}${esc(s.url||s.hostedUrl||s.slug||'Hosted store')}<code>${esc(s.key||'')}</code></td><td><span class="type">${esc(s.install_type||'tag')}</span></td><td><span class="pill ${status(s.status)}">${esc(s.status)}</span></td><td>${s.schema_types||0}</td><td>${s.crawler_allowed?'✓':'×'}</td><td><span class="sig ${pct(s)>=80?'g':pct(s)?'a':'n'}">${s.fill?.filled||0}/${s.fill?.total||7} · ${pct(s)}%</span></td><td>${s.lastSeen?new Date(s.lastSeen).toLocaleString():'—'}</td></tr>`}).join('')}</tbody></table></div>`}
function summary(){const n=sites.length,a=sites.filter(s=>s.status==='active').length,sc=sites.filter(s=>s.schema_types>0).length,f=n?Math.round(sites.reduce((x,s)=>x+pct(s),0)/n):0,c=sites.filter(s=>s.crawler_allowed).length;return `<div class="top"><h1>${t('title')}</h1><div class="who">${a} ${t('active')}</div></div><div class="tiles"><div class="tile"><small>${t('active')}</small><strong class="green">${a}<small>/ ${n}</small></strong></div><div class="tile"><small>${t('schema')}</small><strong class="purple">${sc}<small>/ ${n}</small></strong></div><div class="tile"><small>${t('fill')}</small><strong>${f}%</strong></div><div class="tile"><small>${t('crawler')}</small><strong>${c}<small>/ ${n}</small></strong></div></div><div class="card"><div class="head"><h2>${t('sites')} (${n})</h2><div class="toolbar"><button class="btn" data-view="sites">${t('manage')}</button><button class="btn" id="refresh">${t('refresh')}</button></div></div>${rows([...sites].sort((x,y)=>String(x.url||x.slug).localeCompare(String(y.url||y.slug))))}</div><div class="card" style="margin-top:18px"><div class="head"><h2>${t('crawler')}</h2></div><div class="crawlergrid">${crawlers.map(c=>`<div class="crawler"><strong>${esc(c.ua)}</strong><small>${esc(c.owner||'')}</small></div>`).join('')}</div></div>`}
function sitesView(){let a=sites.filter(s=>!q||String(s.url||s.slug||'').toLowerCase().includes(q.toLowerCase()));if(sort==='fill')a.sort((x,y)=>pct(y)-pct(x));return `<div class="top"><h1>${t('sites')} (${sites.length})</h1><button class="btn primary" id="add">＋ ${t('add')}</button></div><div class="card"><div class="head"><div class="toolbar"><input class="input" id="q" style="width:220px" placeholder="${t('search')}" value="${esc(q)}"><select class="select" id="sort"><option value="url">${t('sort')}</option><option value="fill">${t('fill')}</option></select></div></div>${rows(a)}</div>`}
function detail(s){if(!s)return `<div class="empty">${t('empty')}</div>`;const hosted=s.install_type==='hosted'&&s.hostedUrl,u=hosted?'https://nurevo.jp'+s.hostedUrl:'';return `<div class="top"><h1>${esc(s.url||s.slug||'Hosted store')}</h1><button class="btn" data-view="sites">← ${t('sites')}</button></div>${hosted?`<div class="card panel"><b>${t('hosted')}</b><div class="toolbar"><input class="input" readonly value="${esc(u)}"><button class="btn" id="copy" data-u="${esc(u)}">コピー</button></div><p class="notice">このURLを店舗のGoogleビジネスプロフィールの「ウェブサイト」欄に貼ってください。</p></div>`:''}<div class="detail"><div class="card panel"><form id="form"><div class="field"><label>${t('name')}</label><input class="input" name="name" value="${esc(s._settings?.name||'')}"></div><div class="grid2"><div class="field"><label>${t('address')}</label><input class="input" name="address" value="${esc(s._settings?.address||'')}"></div><div class="field"><label>${t('tel')}</label><input class="input" name="tel" value="${esc(s._settings?.tel||'')}"></div><div class="field"><label>${t('hours')}</label><input class="input" name="hours" value="${esc(s._settings?.hours||'')}"></div><div class="field"><label>${t('lat')}</label><input class="input" name="lat" value="${esc(s._settings?.lat??'')}"></div><div class="field"><label>${t('lng')}</label><input class="input" name="lng" value="${esc(s._settings?.lng??'')}"></div><div class="field"><label>${t('image')}</label><input class="input" name="image" value="${esc(s._settings?.image||'')}"></div></div><div class="field"><label>${t('reserve')}</label><input class="input" name="reserve_url" value="${esc(s._settings?.reserve_url||'')}"></div><label><input type="checkbox" name="serve_schema" ${s._settings?.serve_schema!==0?'checked':''}> ${t('serve')}</label> <label><input type="checkbox" name="allow_crawlers" ${s.crawler_allowed?'checked':''}> ${t('allow')}</label><p><button class="btn primary">${t('save')}</button> <span id="saved" class="notice"></span></p></form></div><div><div class="card panel"><div class="sigrow"><span>${t('schema')}</span><b>${s.schema_types||0}</b></div><div class="sigrow"><span>${t('crawler')}</span><b>${s.crawler_allowed?'ON':'OFF'}</b></div><div class="sigrow"><span>${t('fill')}</span><b>${s.fill?.filled||0}/${s.fill?.total||7} · ${pct(s)}%</b></div><div class="sigrow"><span>${t('last')}</span><b>${s.lastSeen?new Date(s.lastSeen).toLocaleString():'—'}</b></div></div><div class="card" style="margin-top:18px"><div class="head"><h2>${t('crawler')}</h2></div><div class="crawlergrid">${crawlers.map(c=>`<div class="crawler"><strong>${esc(c.ua)}</strong><small>${esc(c.owner||'')}</small></div>`).join('')}</div></div></div></div>`}
function billingView(){const b=billing||{},u=b.unit_prices||{};if(b.scope==='referrer')return `<div class="top"><h1>${t('billing')}</h1></div><div class="tiles"><div class="tile"><small>稼働紹介店舗数</small><strong>${b.active_sites||0}</strong></div><div class="tile"><small>パートナーインセンティブ（支払額）</small><strong class="purple">¥${Number(b.partner_incentive_yen||0).toLocaleString()}<small>/月</small></strong></div><div class="tile"><small>1店舗あたり</small><strong>¥${Number(b.incentive_per_site_yen||1200).toLocaleString()}<small>/月</small></strong></div></div>`;if(b.scope==='agency')return `<div class="top"><h1>${t('billing')}</h1></div><div class="tiles"><div class="tile"><small>稼働店舗数</small><strong>${b.active_sites||0}</strong></div><div class="tile"><small>ご請求金額</small><strong class="purple">¥${Number(b.monthly_invoice_yen||0).toLocaleString()}<small>/月</small></strong></div><div class="tile"><small>1店舗あたり</small><strong>¥${Number(b.wholesale_per_site_yen||2000).toLocaleString()}<small>/月</small></strong></div></div>`;return `<div class="top"><h1>${t('billing')}</h1></div><div class="tiles"><div class="tile"><small>${t('mrr')}</small><strong class="purple">¥${Number(b.mrr_yen||0).toLocaleString()}</strong></div><div class="tile"><small>${t('billSites')}</small><strong>${b.active_billing_sites||0}</strong></div><div class="tile"><small>直接店舗</small><strong>¥${Number(u.direct_monthly_yen||3000).toLocaleString()}<small>/月</small></strong></div><div class="tile"><small>紹介パートナー支払</small><strong>¥${Number(u.referral_monthly_yen||1200).toLocaleString()}<small>/稼働店/月</small></strong></div><div class="tile"><small>${t('wholesale')}</small><strong>¥${Number(u.wholesale_monthly_yen||2000).toLocaleString()}<small>/稼働店/月</small></strong></div></div>`}
async function load(){try{const [a,b,c]=await Promise.all([api('/api/sites'),api('/api/crawlers'),api('/api/billing/summary')]);sites=a.sites||[];crawlers=b.crawlers||[];billing=c;for(const s of sites)try{const z=await api('/api/tag/config?k='+encodeURIComponent(s.key));s._settings={...z.store,serve_schema:z.jsonld?1:0}}catch{}$('#meta').textContent=sites.length+' sites';render()}catch(e){if(e.status===401){$('#main').innerHTML=`<div class="card panel"><h1>${t('auth')}</h1><form id="auth"><input class="input" type="email" required placeholder="${t('email')}"><button class="btn primary">${t('send')}</button><span id="msg" class="notice"></span></form></div>`;$('#auth').onsubmit=async ev=>{ev.preventDefault();try{const r=await api('/api/auth/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:ev.target.querySelector('input').value})});$('#msg').textContent=r.message||'送信しました'}catch(x){$('#msg').textContent=x.message}}}else $('#main').innerHTML=`<p class="error">${esc(e.message)}</p>`}}
function bind(){document.querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>{view=e.dataset.view;render()});$('#lang').onchange=e=>{lang=e.target.value;localStorage.setItem('nrv-dash-lang',lang);render()};$('#refresh')?.addEventListener('click',load);$('#q')?.addEventListener('input',e=>{q=e.target.value;render()});$('#sort')?.addEventListener('change',e=>{sort=e.target.value;render()});$('#add')?.addEventListener('click',add);document.querySelectorAll('[data-site]').forEach(e=>e.onclick=()=>{view='site:'+e.dataset.site;render()});if(view.startsWith('site:')){const s=sites.find(x=>x.id===view.slice(5));$('#copy')?.addEventListener('click',()=>navigator.clipboard?.writeText($('#copy').dataset.u));$('#form')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);await api('/api/sites/'+s.id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({name:f.get('name'),address:f.get('address'),tel:f.get('tel'),hours:f.get('hours'),lat:f.get('lat')?Number(f.get('lat')):null,lng:f.get('lng')?Number(f.get('lng')):null,image:f.get('image'),reserve_url:f.get('reserve_url'),serve_schema:f.has('serve_schema'),allow_crawlers:f.has('allow_crawlers')})});$('#saved').textContent=t('saved');await load()})}}
function add(){const x=document.createElement('div');x.className='modal';x.innerHTML=`<div><h2>${t('add')}</h2><form id="new"><div class="field"><label>${t('install')}</label><select class="select" name="install_type"><option value="tag">${t('tag')}</option><option value="wp">${t('wp')}</option><option value="hosted">${t('hosted')}</option></select></div><div class="field"><label>${t('url')}</label><input class="input" name="url"></div><div class="field"><label>${t('name')}</label><input class="input" name="name"></div><button type="button" class="btn" id="close">${t('cancel')}</button> <button class="btn primary">${t('register')}</button><span id="msg"></span></form></div>`;document.body.append(x);$('#close').onclick=()=>x.remove();$('#new').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/api/sites',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({install_type:f.get('install_type'),url:f.get('url'),name:f.get('name')})});x.remove();await load()}catch(z){$('#msg').textContent=z.message}}}load();
</script><script>(async()=>{const h=document.head;if(!h.querySelector('link[rel="icon"]')){const l=document.createElement('link');l.rel='icon';l.href='/assets/favicon.png';h.append(l)}try{const me=await fetch('/api/me',{credentials:'include'});if(me.ok){const x=await me.json();const top=document.querySelector('.top');if(top&&!top.querySelector('.account')){const a=document.createElement('span');a.className='account';a.style.cssText='color:#5b6472;font-size:13px;display:flex;gap:10px;align-items:center';a.textContent=x.email;const b=document.createElement('button');b.className='btn';b.textContent='Log out';b.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'include'});location.href='https://nurevo.jp/'};a.append(b);top.append(a)}}}catch{}})();</script></body></html>
