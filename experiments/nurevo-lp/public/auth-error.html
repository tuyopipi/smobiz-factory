<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.png"><title>Nurevo</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7fb;color:#17122b;font:16px/1.6 Inter,system-ui,sans-serif}.card{width:min(460px,calc(100% - 32px));padding:32px;border-radius:18px;background:#fff;box-shadow:0 12px 40px #17122b1a;text-align:center}a{display:inline-block;margin-top:18px;padding:10px 18px;border-radius:10px;background:#6f4df6;color:#fff;text-decoration:none;font-weight:700}.lang{position:absolute;top:18px;right:18px}</style></head><body><select class="lang" id="lang"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="tw">繁體中文</option><option value="ko">한국어</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option></select><main class="card"><h1 id="title"></h1><p id="copy"></p><a id="login" href="/dashboard"></a></main><script>const M={ja:['ログインリンクの期限切れ','リンクの有効期限が切れています。もう一度ログインしてください。','再ログイン'],en:['Sign-in link expired','This sign-in link has expired. Please request a new one.','Sign in again'],zh:['登录链接已过期','登录链接已过期，请重新登录。','重新登录'],tw:['登入連結已過期','登入連結已過期，請重新登入。','重新登入'],ko:['로그인 링크 만료','로그인 링크가 만료되었습니다. 다시 로그인해 주세요.','다시 로그인'],es:['Enlace caducado','El enlace ha caducado. Solicita un nuevo inicio de sesión.','Iniciar sesión'],fr:['Lien expiré','Ce lien a expiré. Veuillez vous reconnecter.','Se reconnecter'],de:['Link abgelaufen','Der Link ist abgelaufen. Bitte melden Sie sich erneut an.','Erneut anmelden']};const q=new URLSearchParams(location.search),select=document.querySelector('#lang');function apply(l){l=M[l]?l:'ja';document.documentElement.lang=l;select.value=l;document.querySelector('#title').textContent=M[l][0];document.querySelector('#copy').textContent=M[l][1];document.querySelector('#login').textContent=M[l][2];document.querySelector('#login').href='/dashboard?lang='+encodeURIComponent(l)}apply(q.get('lang')||navigator.language.split('-')[0]);select.onchange=()=>apply(select.value);</script></body></html>
